<!DOCTYPE html>

<body>

<h1>SUPER PINBALL ARCADE</h1>

<div class="info">
    <span>Pontos: <strong id="score">0</strong></span>
    <span>Recorde: <strong id="best">0</strong></span>
    <span>Bolas: <strong id="lives">3</strong></span>
</div>

<div class="game-container">
    <canvas id="game" width="390" height="650"></canvas>
</div>

<div class="controls">
    <button id="leftBtn">◀ ESQUERDA</button>
    <button id="rightBtn">DIREITA ▶</button>

</div>

<div class="instructions">

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");
const livesElement = document.getElementById("lives");

const W = canvas.width;
const H = canvas.height;

const chute = {
    left: 326,
    right: 365,
    top: 38,
    bottom: 525
};

const ball = {
    x: 345,
    y: 500,
    radius: 8,
    vx: 0,
    vy: 0,
    inChute: true,
    launching: false,
    active: false
};

let score = 0;
let best = 0;
let lives = 3;
let gameOver = false;
let launcherHeld = false;
let launcherPower = 0;
let leftHeld = false;
let rightHeld = false;
let lastTime = 0;

try {
    best = Number(localStorage.getItem("pinballBest") || 0);
} catch (e) {
    best = 0;
}

bestElement.textContent = best;

// --------------------------------------------------
// SOM: criado pelo navegador usando Web Audio API
// --------------------------------------------------

let audioContext = null;
let soundEnabled = false;
let lastPegSound = 0;
let lastBumperSound = 0;
let lastRailSound = 0;

function initAudio() {
    try {
        if (!audioContext) {
            const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

            if (!AudioContextClass) return;

            audioContext = new AudioContextClass();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        soundEnabled = true;
    } catch (e) {
        soundEnabled = false;
    }
}

function tone(frequency, duration, type = "sine", volume = 0.12, endFrequency = null) {
    if (!soundEnabled || !audioContext) return;

    try {
        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, now);

        if (endFrequency !== null) {
            oscillator.frequency.exponentialRampToValueAtTime(
                Math.max(1, endFrequency),
                now + duration
            );
        }

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(
            Math.max(0.0002, volume),
            now + 0.008
        );
        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(now);
        oscillator.stop(now + duration + 0.02);
    } catch (e) {}
}

function noiseSound(duration = 0.05, volume = 0.06, filterFrequency = 1200) {
    if (!soundEnabled || !audioContext) return;

    try {
        const length = Math.max(
            1,
            Math.floor(audioContext.sampleRate * duration)
        );

        const buffer = audioContext.createBuffer(
            1,
            length,
            audioContext.sampleRate
        );

        const data = buffer.getChannelData(0);

        for (let i = 0; i < length; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / length);
        }

        const source = audioContext.createBufferSource();
        const filter = audioContext.createBiquadFilter();
        const gain = audioContext.createGain();

        source.buffer = buffer;

        filter.type = "lowpass";
        filter.frequency.value = filterFrequency;

        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + duration
        );

        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioContext.destination);

        source.start();
    } catch (e) {}
}

function playLaunchSound() {
    // Som de mola comprimida e bola disparada.
    tone(150, 0.16, "triangle", 0.13, 520);
    tone(720, 0.10, "sine", 0.08, 240);
    noiseSound(0.06, 0.035, 1800);
}

function playPegSound() {
    const now = performance.now();

    if (now - lastPegSound < 65) return;
    lastPegSound = now;

    tone(1150 + Math.random() * 500, 0.035, "square", 0.035, 750);
}

function playBumperSound() {
    const now = performance.now();

    if (now - lastBumperSound < 100) return;
    lastBumperSound = now;

    tone(420, 0.12, "sine", 0.15, 1050);
    tone(950, 0.07, "triangle", 0.07, 550);
    noiseSound(0.035, 0.025, 2500);
}

function playFlipperSound() {
    tone(260, 0.055, "triangle", 0.08, 110);
    noiseSound(0.025, 0.025, 1800);
}

function playRailSound() {
    const now = performance.now();

    if (now - lastRailSound < 90) return;
    lastRailSound = now;

    tone(190, 0.035, "square", 0.035, 110);
}

function playDrainSound() {
    tone(320, 0.22, "sawtooth", 0.09, 75);
    tone(110, 0.3, "sine", 0.08, 45);
}

function playGameOverSound() {
    tone(420, 0.18, "triangle", 0.09, 280);
    setTimeout(() => tone(280, 0.35, "triangle", 0.08, 100), 160);
}

function playScoreSound() {
    tone(880, 0.045, "sine", 0.045, 1200);
}

// --------------------------------------------------
// ELEMENTOS DO JOGO
// --------------------------------------------------

const bumpers = [
    { x: 100, y: 145, r: 22, color: "#ff3e9d" },
    { x: 205, y: 125, r: 22, color: "#21d4fd" },
    { x: 145, y: 225, r: 20, color: "#ffe45c" },
    { x: 250, y: 235, r: 20, color: "#9b5cff" },
    { x: 75, y: 305, r: 18, color: "#48ff9b" },
    { x: 215, y: 330, r: 20, color: "#ff8c42" }
];

const pegs = [
    [45, 90], [155, 75], [270, 80],
    [55, 200], [305, 175],
    [95, 265], [185, 285], [295, 285],
    [45, 365], [125, 360], [275, 390],
    [85, 420], [180, 405], [285, 440]
];

// Palhetas mais centralizadas e ligeiramente maiores.
const flippers = {
    left: {
        pivotX: 143,
        pivotY: 535,
        length: 75,
        angle: -0.30,
        rest: -0.30,
        pressed: -0.95,
        previousAngle: -0.30
    },

    right: {
        pivotX: 247,
        pivotY: 535,
        length: 75,
        angle: Math.PI + 0.30,
        rest: Math.PI + 0.30,
        pressed: Math.PI + 0.95,
        previousAngle: Math.PI + 0.30
    }
};

// Duas barras inclinadas inferiores.
// As pontas externas ficam mais altas e as internas mais baixas,
// direcionando a bola para a região das palhetas.
const sideRails = [
    { x1: 24, y1: 440, x2: 105, y2: 515 },
    { x1: 285, y1: 515, x2: 366, y2: 440 }
];

function updateInfo() {
    scoreElement.textContent = score;
    bestElement.textContent = best;
    livesElement.textContent = lives;
}

function resetBall() {
    ball.x = (chute.left + chute.right) / 2;
    ball.y = chute.bottom - 25;
    ball.vx = 0;
    ball.vy = 0;
    ball.inChute = true;
    ball.launching = false;
    ball.active = false;

    launcherHeld = false;
    launcherPower = 0;
}

function restartGame() {
    initAudio();

    score = 0;
    lives = 3;
    gameOver = false;

    scoreElement.textContent = score;
    livesElement.textContent = lives;

    resetBall();

    tone(550, 0.07, "sine", 0.06, 800);
}

function startLauncher() {
    initAudio();

    if (gameOver || ball.active || ball.launching || !ball.inChute) {
        return;
    }

    launcherHeld = true;
}

function releaseLauncher() {
    if (!launcherHeld || gameOver || !ball.inChute) return;

    launcherHeld = false;
    ball.inChute = false;
    ball.launching = true;
    ball.active = true;

    ball.x = (chute.left + chute.right) / 2;
    ball.y = chute.bottom - 25;
    ball.vx = 0;

    ball.vy = -(12 + launcherPower * 0.12);

    playLaunchSound();
    launcherPower = 0;
}

function loseBall() {
    lives--;
    playDrainSound();

    if (lives <= 0) {
        lives = 0;
        gameOver = true;
        ball.active = false;
        ball.launching = false;
        ball.inChute = false;
        playGameOverSound();
    } else {
        resetBall();
    }

    updateInfo();
}

function addScore(value) {
    score += value;

    if (score > best) {
        best = score;

        try {
            localStorage.setItem("pinballBest", String(best));
        } catch (e) {}
    }

    updateInfo();
    playScoreSound();
}

function getFlipperTip(f) {
    return {
        x: f.pivotX + Math.cos(f.angle) * f.length,
        y: f.pivotY + Math.sin(f.angle) * f.length
    };
}

function closestPointOnSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax;
    const dy = by - ay;
    const lengthSq = dx * dx + dy * dy;

    let t = 0;

    if (lengthSq > 0) {
        t = ((px - ax) * dx + (py - ay) * dy) / lengthSq;
    }

    t = Math.max(0, Math.min(1, t));

    return {
        x: ax + t * dx,
        y: ay + t * dy
    };
}

// Colisão com segmento, usada pelas barras e palhetas.
function collideWithSegment(ax, ay, bx, by, thickness, bounce = 0.82) {
    const p = closestPointOnSegment(
        ball.x, ball.y,
        ax, ay, bx, by
    );

    const dx = ball.x - p.x;
    const dy = ball.y - p.y;
    const dist = Math.hypot(dx, dy);
    const minDist = ball.radius + thickness;

    if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const ny = dy / dist;

        ball.x = p.x + nx * minDist;
        ball.y = p.y + ny * minDist;

        const dot = ball.vx * nx + ball.vy * ny;

        if (dot < 0) {
            ball.vx -= (1 + bounce) * dot * nx;
            ball.vy -= (1 + bounce) * dot * ny;
        }

        return true;
    }

    return false;
}

function collideWithFlipper(f, side) {
    const tip = getFlipperTip(f);

    const p = closestPointOnSegment(
        ball.x, ball.y,
        f.pivotX, f.pivotY,
        tip.x, tip.y
    );

    const dx = ball.x - p.x;
    const dy = ball.y - p.y;
    const dist = Math.hypot(dx, dy);
    const minDist = ball.radius + 7;

    if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const ny = dy / dist;

        ball.x = p.x + nx * minDist;
        ball.y = p.y + ny * minDist;

        // Impulso extra quando a palheta sobe.
        const angularSpeed = f.angle - f.previousAngle;
        const kick = Math.abs(angularSpeed) > 0.025 ? 4.5 : 0;

        const sideKick = side === "left" ? 1.6 : -1.6;

        ball.vx = nx * 6 + sideKick;
        ball.vy = -Math.abs(ny * 7) - 3.5 - kick;

        // Pequena correção para a bola não ficar presa na palheta.
        if (ball.vy > -3) ball.vy = -3;

        playFlipperSound();
        addScore(5);
    }
}

function collideWithBumpers() {
    for (const b of bumpers) {
        const dx = ball.x - b.x;
        const dy = ball.y - b.y;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.radius + b.r;

        if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;

            ball.x = b.x + nx * minDist;
            ball.y = b.y + ny * minDist;

            const dot = ball.vx * nx + ball.vy * ny;

            ball.vx = (ball.vx - 2 * dot * nx) * 1.12;
            ball.vy = (ball.vy - 2 * dot * ny) * 1.12;

            if (Math.hypot(ball.vx, ball.vy) < 7) {
                ball.vx += nx * 5;
                ball.vy += ny * 5;
            }

            playBumperSound();
            addScore(10);
        }
    }
}

function collideWithPegs() {
    for (const p of pegs) {
        const dx = ball.x - p[0];
        const dy = ball.y - p[1];
        const dist = Math.hypot(dx, dy);
        const minDist = ball.radius + 4;

        if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;

            ball.x = p[0] + nx * minDist;
            ball.y = p[1] + ny * minDist;

            const dot = ball.vx * nx + ball.vy * ny;

            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;

            playPegSound();
            addScore(1);
        }
    }
}

function update() {
    if (gameOver) return;

    if (launcherHeld && ball.inChute) {
        launcherPower = Math.min(launcherPower + 1, 100);
    }

    // Lançamento obrigatório pelo corredor direito.
    if (ball.launching) {
        ball.x = (chute.left + chute.right) / 2;
        ball.y += ball.vy;

        if (ball.y - ball.radius <= chute.top) {
            ball.y = chute.top + ball.radius;

            ball.launching = false;

            // Sai pela abertura superior e entra pela esquerda.
            ball.x = chute.left - ball.radius - 1;
            ball.vx = -5;
            ball.vy = 3;

            tone(680, 0.08, "triangle", 0.08, 950);
        }

        return;
    }

    if (!ball.active || ball.inChute) return;

    // Movimento das palhetas.
    flippers.left.previousAngle = flippers.left.angle;
    flippers.right.previousAngle = flippers.right.angle;

    if (leftHeld) {
        flippers.left.angle +=
            (flippers.left.pressed - flippers.left.angle) * 0.38;
    } else {
        flippers.left.angle +=
            (flippers.left.rest - flippers.left.angle) * 0.24;
    }

    if (rightHeld) {
        flippers.right.angle +=
            (flippers.right.pressed - flippers.right.angle) * 0.38;
    } else {
        flippers.right.angle +=
            (flippers.right.rest - flippers.right.angle) * 0.24;
    }

    // Gravidade e movimento.
    ball.vy += 0.17;
    ball.vx *= 0.999;
    ball.vy *= 0.999;

    const maxSpeed = 12;
    const speed = Math.hypot(ball.vx, ball.vy);

    if (speed > maxSpeed) {
        ball.vx = ball.vx / speed * maxSpeed;
        ball.vy = ball.vy / speed * maxSpeed;
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Parede esquerda.
    if (ball.x - ball.radius < 12) {
        ball.x = 12 + ball.radius;
        ball.vx = Math.abs(ball.vx) * 0.85;
        playRailSound();
    }

    // Parede direita da área de jogo.
    if (ball.x + ball.radius > 316 && ball.y > chute.top + 30) {
        ball.x = 316 - ball.radius;
        ball.vx = -Math.abs(ball.vx) * 0.85;
        playRailSound();
    }

    // Parede superior.
    if (ball.y - ball.radius < 15) {
        ball.y = 15 + ball.radius;
        ball.vy = Math.abs(ball.vy) * 0.8;
        playRailSound();
    }

    // Barras laterais inclinadas com colisão real.
    // Direcionam a bola para o centro e para as palhetas.
    for (const rail of sideRails) {
        if (
            collideWithSegment(
                rail.x1, rail.y1,
                rail.x2, rail.y2,
                5, 0.85
            )
        ) {
            playRailSound();
        }
    }

    // Colisões com os elementos.
    collideWithBumpers();
    collideWithPegs();
    collideWithFlipper(flippers.left, "left");
    collideWithFlipper(flippers.right, "right");

    // Perda da bola.
    if (ball.y + ball.radius >= H - 15) {
        loseBall();
    }
}

// --------------------------------------------------
// DESENHO
// --------------------------------------------------

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#151c42");
    gradient.addColorStop(1, "#080b1a");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "#29366b";
    ctx.lineWidth = 1;

    for (let y = 40; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(15, y);
        ctx.lineTo(315, y);
        ctx.stroke();
    }

    // Laterais da área principal.
    ctx.strokeStyle = "#6b79ff";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(12, 15);
    ctx.lineTo(12, H - 15);
    ctx.lineTo(315, H - 15);
    ctx.lineTo(315, 70);
    ctx.stroke();

    // Corredor de lançamento.
    ctx.strokeStyle = "#ffba49";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(chute.left, chute.bottom);
    ctx.lineTo(chute.left, chute.top);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(chute.right, chute.bottom);
    ctx.lineTo(chute.right, chute.top);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(chute.left, chute.bottom);
    ctx.lineTo(chute.right, chute.bottom);
    ctx.stroke();

    ctx.fillStyle = "#ffba4915";
    ctx.fillRect(
        chute.left + 3,
        chute.top + 2,
        chute.right - chute.left - 6,
        chute.bottom - chute.top - 4
    );

    ctx.strokeStyle = "#41f5ff";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(chute.left - 24, chute.top + 2);
    ctx.lineTo(chute.left - 4, chute.top + 2);
    ctx.stroke();

    ctx.fillStyle = "#41f5ff";
    ctx.font = "bold 10px Arial";
    ctx.fillText("ENTRADA", 255, 27);
}

function drawBumpers() {
    for (const b of bumpers) {
        ctx.save();

        ctx.shadowColor = b.color;
        ctx.shadowBlur = 15;

        const g = ctx.createRadialGradient(
            b.x - 5, b.y - 6, 2,
            b.x, b.y, b.r
        );

        g.addColorStop(0, "#ffffff");
        g.addColorStop(0.25, b.color);
        g.addColorStop(1, "#20254d");

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = b.color;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();
    }
}

function drawPegs() {
    for (const p of pegs) {
        ctx.beginPath();
        ctx.fillStyle = "#eaf5ff";
        ctx.shadowColor = "#7dbfff";
        ctx.shadowBlur = 7;
        ctx.arc(p[0], p[1], 4, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.shadowBlur = 0;
}

function drawSideRails() {
    for (const rail of sideRails) {
        // Sombra da barra.
        ctx.save();
        ctx.lineCap = "round";

        ctx.strokeStyle = "#07102b";
        ctx.lineWidth = 15;
        ctx.beginPath();
        ctx.moveTo(rail.x1, rail.y1 + 3);
        ctx.lineTo(rail.x2, rail.y2 + 3);
        ctx.stroke();

        // Corpo azul luminoso.
        ctx.strokeStyle = "#087cff";
        ctx.lineWidth = 11;
        ctx.shadowColor = "#008dff";
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.moveTo(rail.x1, rail.y1);
        ctx.lineTo(rail.x2, rail.y2);
        ctx.stroke();

        // Filete ciano.
        ctx.strokeStyle = "#65f6ff";
        ctx.lineWidth = 3;
        ctx.shadowBlur = 6;

        ctx.beginPath();
        ctx.moveTo(rail.x1, rail.y1);
        ctx.lineTo(rail.x2, rail.y2);
        ctx.stroke();

        ctx.restore();
    }
}

function drawFlipper(f, color) {
    const tip = getFlipperTip(f);

    ctx.save();
    ctx.strokeStyle = "#ff4c12";
    ctx.lineWidth = 20;
    ctx.lineCap = "round";
    ctx.shadowColor = "#ff8c00";
    ctx.shadowBlur = 10;

    ctx.beginPath();
    ctx.moveTo(f.pivotX, f.pivotY);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();

    ctx.strokeStyle = color;
    ctx.lineWidth = 13;

    ctx.beginPath();
    ctx.moveTo(f.pivotX, f.pivotY);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();

    ctx.strokeStyle = "#fff8a0";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(f.pivotX, f.pivotY);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(f.pivotX, f.pivotY, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawLauncher() {
    const centerX = (chute.left + chute.right) / 2;
    const baseY = chute.bottom - 7;
    const springLength = 25 - launcherPower * 0.12;

    ctx.save();

    ctx.strokeStyle = "#a8b6d8";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(centerX, baseY);
    ctx.lineTo(centerX, baseY - springLength);
    ctx.stroke();

    ctx.strokeStyle = "#ffcf55";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(centerX, baseY);

    const turns = 7;

    for (let i = 1; i <= turns; i++) {
        const y = baseY - springLength * i / turns;
        const x = centerX + (i % 2 === 0 ? -5 : 5);
        ctx.lineTo(x, y);
    }

    ctx.stroke();
    ctx.restore();
}

function drawBall() {
    if (!ball.active && !ball.inChute) return;

    ctx.save();

    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 14;

    const g = ctx.createRadialGradient(
        ball.x - 3, ball.y - 4, 1,
        ball.x, ball.y, ball.radius
    );

    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.45, "#dceaff");
    g.addColorStop(1, "#6879a8");

    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawGameOver() {
    if (!gameOver) return;

    ctx.fillStyle = "#000000bb";
    ctx.fillRect(20, 240, 290, 100);

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd45c";
    ctx.font = "bold 26px Arial";
    ctx.fillText("FIM DE JOGO", 165, 280);

    ctx.fillStyle = "white";
    ctx.font = "16px Arial";
    ctx.fillText("Toque em REINICIAR", 165, 310);
    ctx.textAlign = "left";
}

function draw() {
    drawBackground();
    drawPegs();
    drawBumpers();

    // Barras desenhadas antes das palhetas.
    drawSideRails();

    drawFlipper(flippers.left, "#34d9ff");
    drawFlipper(flippers.right, "#ff4fb8");

    drawLauncher();
    drawBall();
    drawGameOver();

    if (launcherHeld && ball.inChute) {
        ctx.fillStyle = "#ffd45c";
        ctx.font = "bold 12px Arial";
        ctx.fillText(
            "MOLA: " + Math.floor(launcherPower) + "%",
            12,
            H - 28
        );
    }
}

resetBall();
updateInfo();

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;

    let dt = (timestamp - lastTime) / 16.667;
    lastTime = timestamp;

    dt = Math.min(dt, 2);

    // Atualiza a física algumas vezes por quadro para melhorar
    // a precisão das colisões em aparelhos com taxas diferentes.
    const steps = Math.max(1, Math.ceil(dt));

    for (let i = 0; i < steps; i++) {
        update();
    }

    draw();
    requestAnimationFrame(loop);
}
