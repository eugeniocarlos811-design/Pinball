<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101e">
<title>Super Pinball Arcade V4</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #07101e;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 2px 4px calc(4px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

h1 {
    color: #36e6ff;
    font-size: clamp(17px, 4.5vw, 25px);
    text-align: center;
    text-shadow: 0 0 10px #008cff;
    margin: 2px 0 3px;
}

.info {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 3px;
    font-size: 12px;
    font-weight: bold;
}

.info span {
    color: #ffe66d;
}

#game {
    display: block;
    width: min(98vw, 450px);
    height: auto;
    max-height: 73dvh;
    aspect-ratio: 400 / 650;
    border: 2px solid #35dcff;
    border-radius: 7px;
    background: #081a33;
    box-shadow: 0 0 12px #008cff66;
    touch-action: none;
}

.controls {
    width: min(98vw, 450px);
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 4px;
    margin-top: 4px;
}

button {
    min-width: 0;
    min-height: 34px;
    padding: 4px 1px;
    border: 1px solid #ffffff66;
    border-radius: 7px;
    color: white;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

button:active {
    filter: brightness(1.3);
}

.flipper {
    background: linear-gradient(#169fe8, #064c98);
}

#launchBtn {
    background: linear-gradient(#ffb72e, #d85a00);
}

#restartBtn {
    background: linear-gradient(#29c96f, #087b3c);
}

#updateBtn {
    width: min(98vw, 450px);
    min-height: 30px;
    margin-top: 4px;
    background: linear-gradient(#36c9ff, #1263cf);
    border-color: #8be8ff;
}

@media (max-height: 600px) {
    h1 { font-size: 16px; margin: 0 0 2px; }
    .info { font-size: 10px; margin-bottom: 2px; }
    #game { max-height: 65dvh; }
    button { min-height: 28px; font-size: 10px; }
    #updateBtn { min-height: 26px; }
}
</style>
</head>

<body>

<h1>🎮 SUPER PINBALL ARCADE</h1>

<div class="info">
    <div>PONTOS: <span id="score">0</span></div>
    <div>RECORDE: <span id="record">0</span></div>
    <div>BOLAS: <span id="balls">3</span></div>
</div>

<canvas id="game" width="400" height="650"></canvas>

<div class="controls">
    <button id="leftBtn" class="flipper">◀ FLIPER</button>
    <button id="rightBtn" class="flipper">FLIPER ▶</button>
    <button id="launchBtn">🚀 LANÇAR</button>
    <button id="restartBtn">🔄 REINICIAR</button>
</div>

<button id="updateBtn">🌐 ATUALIZAR SITE</button>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const ballsText = document.getElementById("balls");
const recordText = document.getElementById("record");

const W = 400;
const H = 650;

let score = 0;
let balls = 3;
let record = 0;
let gameOver = false;
let ballInLauncher = true;
let launching = false;
let leftPressed = false;
let rightPressed = false;
let lastTime = 0;
let audio = null;
let lastWallSound = 0;

try {
    record = Number(localStorage.getItem("pinballRecord")) || 0;
} catch (e) {}

const ball = {
    x: 356,
    y: 555,
    vx: 0,
    vy: 0,
    r: 8
};

const bumpers = [
    {x: 100, y: 140, r: 23, color: "#ff3c89", points: 100, cooldown: 0},
    {x: 230, y: 140, r: 23, color: "#25dfff", points: 100, cooldown: 0},
    {x: 165, y: 220, r: 25, color: "#ffe24a", points: 150, cooldown: 0},
    {x: 75, y: 285, r: 19, color: "#9b6bff", points: 100, cooldown: 0},
    {x: 265, y: 285, r: 19, color: "#ff7b35", points: 100, cooldown: 0},
    {x: 165, y: 350, r: 22, color: "#39f58a", points: 150, cooldown: 0}
];

const pegs = [
    {x: 48, y: 200},
    {x: 300, y: 200},
    {x: 125, y: 270},
    {x: 210, y: 270},
    {x: 45, y: 335},
    {x: 300, y: 340},
    {x: 105, y: 390},
    {x: 235, y: 390}
];

const leftFlipper = {
    x: 105, y: 540, length: 88, lastHit: 0
};

const rightFlipper = {
    x: 260, y: 540, length: 88, lastHit: 0
};

const rails = [
    {x1: 24, y1: 420, x2: 94, y2: 493},
    {x1: 316, y1: 420, x2: 271, y2: 493}
];

recordText.textContent = record;

function updateText() {
    scoreText.textContent = score;
    ballsText.textContent = balls;
    recordText.textContent = record;
}

function saveRecord() {
    if (score > record) {
        record = score;
        try {
            localStorage.setItem("pinballRecord", String(record));
        } catch (e) {}
    }
    updateText();
}

function initAudio() {
    try {
        if (!audio) {
            const AudioClass =
                window.AudioContext || window.webkitAudioContext;

            if (AudioClass) audio = new AudioClass();
        }

        if (audio && audio.state === "suspended") {
            audio.resume();
        }
    } catch (e) {}
}

function sound(freq, duration = 0.06, type = "sine", volume = 0.05) {
    if (!audio) return;

    try {
        const osc = audio.createOscillator();
        const gain = audio.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, audio.currentTime);

        gain.gain.setValueAtTime(volume, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(audio.destination);

        osc.start();
        osc.stop(audio.currentTime + duration);
    } catch (e) {}
}

function resetBall() {
    ball.x = 356;
    ball.y = 555;
    ball.vx = 0;
    ball.vy = 0;

    ballInLauncher = true;
    launching = false;

    leftFlipper.lastHit = 0;
    rightFlipper.lastHit = 0;

    bumpers.forEach(b => b.cooldown = 0);
}

function restartGame() {
    initAudio();

    score = 0;
    balls = 3;
    gameOver = false;
    leftPressed = false;
    rightPressed = false;

    resetBall();
    updateText();
    sound(500, 0.1, "triangle", 0.05);
}

function launchBall() {
    initAudio();

    if (gameOver) restartGame();

    if (ballInLauncher && !launching) {
        launching = true;
        ball.vx = 0;
        ball.vy = -18;
        sound(170, 0.16, "sawtooth", 0.07);
    }
}

function loseBall() {
    if (gameOver) return;

    balls--;
    sound(120, 0.18, "triangle", 0.05);
    saveRecord();

    if (balls <= 0) {
        balls = 0;
        gameOver = true;
        ballInLauncher = false;
        launching = false;
    } else {
        resetBall();
    }

    updateText();
}

function addPoints(value) {
    score += value;
    saveRecord();
}

function drawCircle(x, y, r, color, glow = 0) {
    ctx.save();

    if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = glow;
    }

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    ctx.restore();
}

function drawLine(x1, y1, x2, y2, color, width) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.stroke();
}

/*
   A posição visual e a posição usada na colisão
   são calculadas pela mesma função.
*/
function getFlipperSegment(f, isLeft, pressed) {
    const angle = isLeft
        ? (pressed ? -0.48 : 0.18)
        : (pressed ? Math.PI + 0.48 : Math.PI - 0.18);

    return {
        x1: f.x,
        y1: f.y,
        x2: f.x + Math.cos(angle) * f.length,
        y2: f.y + Math.sin(angle) * f.length
    };
}

function drawFlipper(f, isLeft, pressed) {
    const s = getFlipperSegment(f, isLeft, pressed);

    drawLine(s.x1, s.y1, s.x2, s.y2, "#050a15", 20);

    drawLine(
        s.x1, s.y1, s.x2, s.y2,
        pressed ? "#fff36b" : "#ffb52e",
        12
    );

    drawCircle(f.x, f.y, 10, "#e9f8ff");
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#102b52");
    bg.addColorStop(1, "#050b19");

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Laterais reforçadas
    drawLine(15, 18, 15, 585, "#27dfff", 6);
    drawLine(15, 18, 385, 18, "#27dfff", 6);
    drawLine(385, 18, 385, 585, "#27dfff", 6);
    drawLine(15, 585, 100, 630, "#27dfff", 6);
    drawLine(385, 585, 300, 630, "#27dfff", 6);
    drawLine(100, 630, 300, 630, "#27dfff", 6);

    // Corredor de lançamento
    drawLine(330, 55, 330, 580, "#ffcc4a", 4);
    drawLine(385, 55, 385, 585, "#ffcc4a", 4);
    drawLine(330, 55, 345, 23, "#ffcc4a", 4);
    drawLine(345, 23, 385, 23, "#ffcc4a", 4);

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffe66d";
    ctx.font = "bold 10px Arial";
    ctx.fillText("LANÇAMENTO", 356, 315);
    ctx.fillText("↑", 356, 337);

    // Barreiras diagonais
    rails.forEach(r => {
        drawLine(r.x1, r.y1, r.x2, r.y2, "#08101c", 13);
        drawLine(r.x1, r.y1, r.x2, r.y2, "#f7c64a", 7);
    });

    // Bumpers
    bumpers.forEach(b => {
        drawCircle(b.x, b.y, b.r + 5, "#193c61");
        drawCircle(b.x, b.y, b.r, b.color, 12);
        drawCircle(b.x - 5, b.y - 6, 5, "#ffffff");

        ctx.fillStyle = "#07101e";
        ctx.font = "bold 13px Arial";
        ctx.fillText("+", b.x, b.y + 5);
    });

    // Pinos pequenos
    pegs.forEach(p => {
        drawCircle(p.x, p.y, 7, "#1d526f");
        drawCircle(p.x, p.y, 4, "#a6f7ff", 5);
    });

    // Palhetas
    drawFlipper(leftFlipper, true, leftPressed);
    drawFlipper(rightFlipper, false, rightPressed);

    // Bola
    drawCircle(ball.x, ball.y, ball.r + 2, "#a6d8ff", 8);
    drawCircle(ball.x - 2, ball.y - 2, ball.r - 2, "#ffffff");

    if (gameOver) {
        ctx.fillStyle = "#ff5577";
        ctx.font = "bold 28px Arial";
        ctx.fillText("FIM DE JOGO", 170, 300);

        ctx.fillStyle = "#ffffff";
        ctx.font = "15px Arial";
        ctx.fillText("Toque em REINICIAR", 170, 330);
    } else if (ballInLauncher && !launching) {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px Arial";
        ctx.fillText("TOQUE EM", 357, 485);
        ctx.fillText("LANÇAR", 357, 502);
    }

    ctx.textAlign = "start";
}

/* Colisão com barreiras diagonais */
function hitRail(rail) {
    const dx = rail.x2 - rail.x1;
    const dy = rail.y2 - rail.y1;
    const lengthSq = dx * dx + dy * dy;

    let t = (
        (ball.x - rail.x1) * dx +
        (ball.y - rail.y1) * dy
    ) / lengthSq;

    t = Math.max(0, Math.min(1, t));

    const px = rail.x1 + t * dx;
    const py = rail.y1 + t * dy;
    const ox = ball.x - px;
    const oy = ball.y - py;
    const distance = Math.hypot(ox, oy);
    const minDistance = ball.r + 5;

    if (distance < minDistance && distance > 0) {
        const nx = ox / distance;
        const ny = oy / distance;

        ball.x = px + nx * (minDistance + 0.5);
        ball.y = py + ny * (minDistance + 0.5);

        const dot = ball.vx * nx + ball.vy * ny;

        // Só rebate se a bola estiver indo contra a barreira
        if (dot < 0) {
            ball.vx -= 1.8 * dot * nx;
            ball.vy -= 1.8 * dot * ny;
            wallSound();
        }
    }
}

function hitBumper(b) {
    const now = performance.now();

    if (now < b.cooldown) return;

    const dx = ball.x - b.x;
    const dy = ball.y - b.y;
    const distance = Math.hypot(dx, dy);
    const minDistance = ball.r + b.r;

    if (distance < minDistance && distance > 0) {
        const nx = dx / distance;
        const ny = dy / distance;

        ball.x = b.x + nx * (minDistance + 1);
        ball.y = b.y + ny * (minDistance + 1);

        const dot = ball.vx * nx + ball.vy * ny;

        if (dot < 0) {
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
        }

        ball.vx += nx * 3;
        ball.vy += ny * 3;

        limitSpeed();
        b.cooldown = now + 120;

        addPoints(b.points);
        sound(650 + Math.random() * 300, 0.08, "sine", 0.07);
    }
}

function hitPegs() {
    const now = performance.now();

    for (const p of pegs) {
        const dx = ball.x - p.x;
        const dy = ball.y - p.y;
        const distance = Math.hypot(dx, dy);
        const minDistance = ball.r + 5;

        if (distance < minDistance && distance > 0) {
            const nx = dx / distance;
            const ny = dy / distance;

            ball.x = p.x + nx * (minDistance + 1);
            ball.y = p.y + ny * (minDistance + 1);

            const dot = ball.vx * nx + ball.vy * ny;

            if (dot < 0) {
                ball.vx -= 1.8 * dot * nx;
                ball.vy -= 1.8 * dot * ny;
            }

            limitSpeed();
            addPoints(10);

            if (!p.cooldown || now > p.cooldown) {
                sound(850, 0.035, "square", 0.025);
                p.cooldown = now + 90;
            }
        }
    }
}

/*
   CORREÇÃO PRINCIPAL:
   se a palheta não estiver levantada, não existe
   colisão com ela. A colisão usa exatamente o
   mesmo segmento desenhado na tela.
*/
function hitFlipper(f, isLeft, pressed) {
    if (!pressed) return;

    const now = performance.now();

    if (now - f.lastHit < 140) return;

    const s = getFlipperSegment(f, isLeft, true);
    const dx = s.x2 - s.x1;
    const dy = s.y2 - s.y1;
    const lengthSq = dx * dx + dy * dy;

    let t = (
        (ball.x - s.x1) * dx +
        (ball.y - s.y1) * dy
    ) / lengthSq;

    t = Math.max(0, Math.min(1, t));

    const px = s.x1 + t * dx;
    const py = s.y1 + t * dy;
    const ox = ball.x - px;
    const oy = ball.y - py;
    const distance = Math.hypot(ox, oy);
    const minDistance = ball.r + 7;

    if (distance < minDistance && distance > 0) {
        const nx = ox / distance;
        const ny = oy / distance;

        ball.x = px + nx * (minDistance + 1);
        ball.y = py + ny * (minDistance + 1);

        // Impulso para cima, sem empurrar repetidamente
        ball.vy = Math.min(ball.vy, -11.5);
        ball.vx += isLeft ? 2.2 : -2.2;

        limitSpeed();

        f.lastHit = now;
        addPoints(10);
        sound(300, 0.07, "triangle", 0.06);
    }
}

function limitSpeed() {
    const maxSpeed = 16;
    const speed = Math.hypot(ball.vx, ball.vy);

    if (speed > maxSpeed) {
        ball.vx = ball.vx / speed * maxSpeed;
        ball.vy = ball.vy / speed * maxSpeed;
    }
}

function update(dt) {
    if (gameOver) return;

    const step = Math.min(dt, 2);

    // Lançamento pelo corredor externo
    if (launching) {
        ball.y -= 16 * step;
        ball.x = 356;

        if (ball.y <= 48) {
            launching = false;
            ballInLauncher = false;

            ball.x = 320;
            ball.y = 58;
            ball.vx = -6;
            ball.vy = 3;

            sound(950, 0.12, "triangle", 0.07);
        }

        return;
    }

    if (ballInLauncher) return;

    // Gravidade
    ball.vy += 0.19 * step;
    ball.x += ball.vx * step;
    ball.y += ball.vy * step;

    // Paredes da área principal
    if (ball.x - ball.r < 21) {
        ball.x = 21 + ball.r;

        if (ball.vx < 0) {
            ball.vx = Math.abs(ball.vx) * 0.9;
            wallSound();
        }
    }

    if (ball.x + ball.r > 325) {
        ball.x = 325 - ball.r;

        if (ball.vx > 0) {
            ball.vx = -Math.abs(ball.vx) * 0.9;
            wallSound();
        }
    }

    if (ball.y - ball.r < 25) {
        ball.y = 25 + ball.r;

        if (ball.vy < 0) {
            ball.vy = Math.abs(ball.vy) * 0.85;
            wallSound();
        }
    }

    rails.forEach(hitRail);

    bumpers.forEach(hitBumper);
    hitPegs();

    // Só há colisão se a palheta estiver levantada
    hitFlipper(leftFlipper, true, leftPressed);
    hitFlipper(rightFlipper, false, rightPressed);

    limitSpeed();

    // A bola cai pela abertura entre as palhetas
    if (ball.y > 646) {
        loseBall();
    }
}

function wallSound() {
    const now = performance.now();

    if (now - lastWallSound > 75) {
        lastWallSound = now;
        sound(180, 0.045, "square", 0.035);
    }
}

function setupHoldButton(id, side) {
    const btn = document.getElementById(id);

    function down(e) {
        e.preventDefault();
        initAudio();

        if (side === "left") leftPressed = true;
        if (side === "right") rightPressed = true;
    }

    function up(e) {
        e.preventDefault();

        if (side === "left") leftPressed = false;
        if (side === "right") rightPressed = false;
    }

    btn.addEventListener("pointerdown", down);
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointercancel", up);
    btn.addEventListener("pointerleave", up);
    btn.addEventListener("contextmenu", e => e.preventDefault());
}

setupHoldButton("leftBtn", "left");
setupHoldButton("rightBtn", "right");

document.getElementById("launchBtn")
    .addEventListener("click", launchBall);

document.getElementById("restartBtn")
    .addEventListener("click", restartGame);

document.getElementById("updateBtn")
    .addEventListener("click", () => {
        const url = new URL(window.location.href);
        url.searchParams.set("atualizar", Date.now().toString());
        window.location.replace(url.toString());
    });

document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        leftPressed = true;
        e.preventDefault();
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        rightPressed = true;
        e.preventDefault();
    }

    if (e.code === "Space") {
        launchBall();
        e.preventDefault();
    }
});

document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        leftPressed = false;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        rightPressed = false;
    }
});

updateText();
resetBall();
draw();

function loop(time) {
    if (!lastTime) lastTime = time;

    const dt = (time - lastTime) / 16.67;
    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
