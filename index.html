<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Super Pinball Arcade</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    touch-action: manipulation;
}

body {
    background: #090b19;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
}

h1 {
    color: #ffd45c;
    font-size: clamp(20px, 5vw, 30px);
    text-align: center;
    margin: 5px 0 10px;
    text-shadow: 0 0 12px #ff8c00;
}

.info {
    width: min(100%, 390px);
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 8px;
}

.game-container {
    width: min(100%, 390px);
    position: relative;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #10152b;
    border: 3px solid #5967ff;
    border-radius: 12px;
    box-shadow: 0 0 18px #3e4fff80;
}

.controls {
    width: min(100%, 390px);
    display: grid;
    grid-template-columns: 1fr 1fr 1.2fr;
    gap: 10px;
    margin-top: 12px;
}

button {
    min-height: 54px;
    border: 0;
    border-radius: 12px;
    font-weight: bold;
    font-size: 15px;
    color: white;
    background: #343d86;
    box-shadow: 0 4px 0 #171c49;
    user-select: none;
    -webkit-user-select: none;
}

button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #171c49;
}

#launchBtn {
    background: #e47a18;
    box-shadow: 0 4px 0 #873d06;
}

#restartBtn {
    width: min(100%, 390px);
    margin-top: 10px;
    background: #178c70;
}

.instructions {
    width: min(100%, 390px);
    color: #bfc8ff;
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>SUPER PINBALL ARCADE</h1>

<div class="info">
    <span>Pontos: <strong id="score">0</strong></span>
    <span>Recorde: <strong id="best">0</strong></span>
    <span>Bolas: <strong id="lives">3</strong></span>
</div>

<div class="game-container">
    <canvas id="game" width="390" height="650"></canvas>
</div>

<div class="controls">
    <button id="leftBtn">◀ ESQUERDA</button>
    <button id="rightBtn">DIREITA ▶</button>
    <button id="launchBtn">SEGURE<br>LANÇAR</button>
</div>

<button id="restartBtn">REINICIAR JOGO</button>

<div class="instructions">
    Segure LANÇAR para comprimir a mola e solte para disparar a bola.
    A bola subirá pelo corredor direito até o topo e entrará no jogo pela esquerda.
</div>

<script>
// --- ÁUDIO (Web Audio API) ---
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(type) {
    initAudio();
    if (!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'launch') {
        // Som de lançamento (subida rápida de frequência com ruído/onda senoidal)
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'bumper') {
        // Som agudo e vibrante ao bater em bumpers
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'peg') {
        // Som curto para pinos menores
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
    } else if (type === 'flipper') {
        // Som grave ao bater na palheta
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(220, now + 0.1);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'gameover') {
        // Som descendente de fim de jogo
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.6);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
    }
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");
const livesElement = document.getElementById("lives");

const W = canvas.width;
const H = canvas.height;

// Corredor de lançamento no lado direito.
const chute = {
    left: 326,
    right: 365,
    top: 38,
    bottom: 525
};

// Triângulos defletores laterais na base (evitam que a bola caia direto pelas laterais)
const sideTriangles = [
    { x1: 12, y1: 520, x2: 75, y2: 575, x3: 12, y3: 575 },   // Esquerdo
    { x1: 315, y1: 520, x2: 252, y2: 575, x3: 315, y3: 575 }  // Direito
];

const ball = {
    x: 345,
    y: 500,
    radius: 8,
    vx: 0,
    vy: 0,
    inChute: true,
    launching: false,
    active: false
};

let score = 0;
let best = Number(localStorage.getItem("pinballBest") || 0);
let lives = 3;
let gameOver = false;
let launcherHeld = false;
let launcherPower = 0;
let leftHeld = false;
let rightHeld = false;
let animationId = null;

bestElement.textContent = best;

const bumpers = [
    { x: 100, y: 145, r: 22, color: "#ff3e9d" },
    { x: 205, y: 125, r: 22, color: "#21d4fd" },
    { x: 145, y: 225, r: 20, color: "#ffe45c" },
    { x: 250, y: 235, r: 20, color: "#9b5cff" },
    { x: 75, y: 305, r: 18, color: "#48ff9b" },
    { x: 215, y: 330, r: 20, color: "#ff8c42" }
];

const pegs = [
    [45, 90], [155, 75], [270, 80],
    [55, 200], [305, 175],
    [95, 265], [185, 285], [295, 285],
    [45, 365], [125, 360], [275, 390],
    [85, 420], [180, 405], [285, 440]
];

// Palhetas (flippers) centralizadas e simétricas na parte inferior
const flippers = {
    left: {
        pivotX: 105,
        pivotY: 550,
        length: 62,
        angle: -0.35,
        rest: -0.35,
        pressed: -0.95
    },
    right: {
        pivotX: 222,
        pivotY: 550,
        length: 62,
        angle: Math.PI + 0.35,
        rest: Math.PI + 0.35,
        pressed: Math.PI + 0.95
    }
};

function resetBall() {
    ball.x = (chute.left + chute.right) / 2;
    ball.y = chute.bottom - 25;
    ball.vx = 0;
    ball.vy = 0;
    ball.inChute = true;
    ball.launching = false;
    ball.active = false;
    launcherHeld = false;
    launcherPower = 0;
}

function restartGame() {
    score = 0;
    lives = 3;
    gameOver = false;
    scoreElement.textContent = score;
    livesElement.textContent = lives;
    resetBall();
}

function startLauncher() {
    if (gameOver || ball.active || ball.launching || !ball.inChute) return;
    initAudio();
    launcherHeld = true;
}

function releaseLauncher() {
    if (!launcherHeld || gameOver || !ball.inChute) return;

    launcherHeld = false;
    ball.inChute = false;
    ball.launching = true;
    ball.active = true;

    playSound('launch');

    // Mantém a bola centralizada dentro do corredor.
    ball.x = (chute.left + chute.right) / 2;
    ball.y = chute.bottom - 25;
    ball.vx = 0;

    // A bola sobe em etapas fixas, sem poder sair antes do topo.
    ball.vy = -(12 + launcherPower * 0.12);

    launcherPower = 0;
}

function loseBall() {
    lives--;
    livesElement.textContent = lives;

    if (lives <= 0) {
        gameOver = true;
        ball.active = false;
        ball.launching = false;
        ball.inChute = false;
        playSound('gameover');
    } else {
        resetBall();
    }
}

function addScore(value) {
    score += value;
    scoreElement.textContent = score;

    if (score > best) {
        best = score;
        bestElement.textContent = best;
        localStorage.setItem("pinballBest", String(best));
    }
}

function getFlipperTip(f) {
    return {
        x: f.pivotX + Math.cos(f.angle) * f.length,
        y: f.pivotY + Math.sin(f.angle) * f.length
    };
}

function closestPointOnSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax;
    const dy = by - ay;
    const lengthSq = dx * dx + dy * dy;

    let t = 0;
    if (lengthSq > 0) {
        t = ((px - ax) * dx + (py - ay) * dy) / lengthSq;
    }

    t = Math.max(0, Math.min(1, t));

    return {
        x: ax + t * dx,
        y: ay + t * dy
    };
}

function collideWithFlipper(f) {
    const tip = getFlipperTip(f);
    const p = closestPointOnSegment(
        ball.x, ball.y,
        f.pivotX, f.pivotY,
        tip.x, tip.y
    );

    const dx = ball.x - p.x;
    const dy = ball.y - p.y;
    const dist = Math.hypot(dx, dy);
    const minDist = ball.radius + 7;

    if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const ny = dy / dist;

        ball.x = p.x + nx * minDist;
        ball.y = p.y + ny * minDist;

        const speed = 9;
        ball.vx = nx * speed + (f === flippers.left ? 2 : -2);
        ball.vy = -Math.abs(ny * speed) - 4;

        playSound('flipper');
        addScore(5);
    }
}

// Colisão simples com os triângulos laterais da base
function collideWithSideTriangles() {
    // Esquerdo: x entre 12 e 75, y entre 520 e 575
    // Aproximação por linha inclinada do triângulo esquerdo (x1,y1) até (x2,y2)
    // Linha diagonal do triângulo esquerdo: de (12, 520) a (75, 575)
    const pLeft = closestPointOnSegment(ball.x, ball.y, 12, 520, 75, 575);
    const distLeft = Math.hypot(ball.x - pLeft.x, ball.y - pLeft.y);
    if (distLeft < ball.radius + 2 && ball.y > 515 && ball.x < 80) {
        ball.vx = Math.abs(ball.vx) + 3;
        ball.vy -= 3;
        ball.x = pLeft.x + (ball.radius + 2);
        playSound('peg');
    }

    // Direito: linha diagonal de (315, 520) a (252, 575)
    const pRight = closestPointOnSegment(ball.x, ball.y, 315, 520, 252, 575);
    const distRight = Math.hypot(ball.x - pRight.x, ball.y - pRight.y);
    if (distRight < ball.radius + 2 && ball.y > 515 && ball.x > 245) {
        ball.vx = -(Math.abs(ball.vx) + 3);
        ball.vy -= 3;
        ball.x = pRight.x - (ball.radius + 2);
        playSound('peg');
    }
}

function collideWithBumpers() {
    for (const b of bumpers) {
        const dx = ball.x - b.x;
        const dy = ball.y - b.y;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.radius + b.r;

        if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;

            ball.x = b.x + nx * minDist;
            ball.y = b.y + ny * minDist;

            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx = (ball.vx - 2 * dot * nx) * 1.12;
            ball.vy = (ball.vy - 2 * dot * ny) * 1.12;

            if (Math.hypot(ball.vx, ball.vy) < 7) {
                ball.vx += nx * 5;
                ball.vy += ny * 5;
            }

            playSound('bumper');
            addScore(10);
        }
    }
}

function collideWithPegs() {
    for (const p of pegs) {
        const dx = ball.x - p[0];
        const dy = ball.y - p[1];
        const dist = Math.hypot(dx, dy);
        const minDist = ball.radius + 4;

        if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;

            ball.x = p[0] + nx * minDist;
            ball.y = p[1] + ny * minDist;

            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;

            playSound('peg');
            addScore(1);
        }
    }
}

function update() {
    if (gameOver) return;

    if (launcherHeld && ball.inChute) {
        launcherPower = Math.min(launcherPower + 1, 100);
    }

    // Durante o lançamento, a bola segue uma rota obrigatória.
    if (ball.launching) {
        ball.x = (chute.left + chute.right) / 2;
        ball.y += ball.vy;

        if (ball.y - ball.radius <= chute.top) {
            ball.y = chute.top + ball.radius;
            ball.launching = false;

            ball.x = chute.left - ball.radius - 1;
            ball.vx = -5;
            ball.vy = 3;
        }

        return;
    }

    if (!ball.active || ball.inChute) return;

    if (leftHeld) {
        flippers.left.angle += (flippers.left.pressed - flippers.left.angle) * 0.35;
    } else {
        flippers.left.angle += (flippers.left.rest - flippers.left.angle) * 0.25;
    }

    if (rightHeld) {
        flippers.right.angle += (flippers.right.pressed - flippers.right.angle) * 0.35;
    } else {
        flippers.right.angle += (flippers.right.rest - flippers.right.angle) * 0.25;
    }

    ball.vy += 0.17;
    ball.vx *= 0.999;
    ball.vy *= 0.999;

    const maxSpeed = 12;
    const speed = Math.hypot(ball.vx, ball.vy);

    if (speed > maxSpeed) {
        ball.vx = ball.vx / speed * maxSpeed;
        ball.vy = ball.vy / speed * maxSpeed;
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Paredes laterais da área principal.
    if (ball.x - ball.radius < 12) {
        ball.x = 12 + ball.radius;
        ball.vx = Math.abs(ball.vx) * 0.85;
    }

    if (ball.x + ball.radius > 316 && ball.y > chute.top + 30) {
        ball.x = 316 - ball.radius;
        ball.vx = -Math.abs(ball.vx) * 0.85;
    }

    if (ball.y - ball.radius < 15) {
        ball.y = 15 + ball.radius;
        ball.vy = Math.abs(ball.vy) * 0.8;
    }

    if (ball.y + ball.radius >= H - 15) {
        loseBall();
        return;
    }

    collideWithBumpers();
    collideWithPegs();
    collideWithSideTriangles();
    collideWithFlipper(flippers.left);
    collideWithFlipper(flippers.right);
}

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#151c42");
    gradient.addColorStop(1, "#080b1a");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Linhas decorativas.
    ctx.strokeStyle = "#29366b";
    ctx.lineWidth = 1;

    for (let y = 40; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(15, y);
        ctx.lineTo(315, y);
        ctx.stroke();
    }

    // Laterais da área principal.
    ctx.strokeStyle = "#6b79ff";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(12, 15);
    ctx.lineTo(12, H - 15);
    ctx.lineTo(315, H - 15);
    ctx.lineTo(315, 70);
    ctx.stroke();

    // Desenho dos triângulos laterais na base
    ctx.fillStyle = "#25306b";
    ctx.strokeStyle = "#5967ff";
    ctx.lineWidth = 2;

    for (const t of sideTriangles) {
        ctx.beginPath();
        ctx.moveTo(t.x1, t.y1);
        ctx.lineTo(t.x2, t.y2);
        ctx.lineTo(t.x3, t.y3);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    // Corredor vertical direito.
    ctx.strokeStyle = "#ffba49";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(chute.left, chute.bottom);
    ctx.lineTo(chute.left, chute.top);
    ctx.lineTo(chute.left - 1, chute.top);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(chute.right, chute.bottom);
    ctx.lineTo(chute.right, chute.top);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(chute.left, chute.bottom);
    ctx.lineTo(chute.right, chute.bottom);
    ctx.stroke();

    ctx.fillStyle = "#ffba4915";
    ctx.fillRect(chute.left + 3, chute.top + 2,
                 chute.right - chute.left - 6,
                 chute.bottom - chute.top - 4);

    ctx.strokeStyle = "#41f5ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(chute.left - 24, chute.top + 2);
    ctx.lineTo(chute.left - 4, chute.top + 2);
    ctx.stroke();

    ctx.fillStyle = "#41f5ff";
    ctx.font = "bold 10px Arial";
    ctx.fillText("ENTRADA", 255, 27);
}

function drawBumpers() {
    for (const b of bumpers) {
        ctx.save();

        ctx.shadowColor = b.color;
        ctx.shadowBlur = 15;

        const g = ctx.createRadialGradient(
            b.x - 5, b.y - 6, 2,
            b.x, b.y, b.r
        );

        g.addColorStop(0, "#ffffff");
        g.addColorStop(0.25, b.color);
        g.addColorStop(1, "#20254d");

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = b.color;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();
    }
}

function drawPegs() {
    for (const p of pegs) {
        ctx.beginPath();
        ctx.fillStyle = "#eaf5ff";
        ctx.shadowColor = "#7dbfff";
        ctx.shadowBlur = 7;
        ctx.arc(p[0], p[1], 4, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.shadowBlur = 0;
}

function drawFlipper(f, color) {
    const tip = getFlipperTip(f);

    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 13;
    ctx.lineCap = "round";
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;

    ctx.beginPath();
    ctx.moveTo(f.pivotX, f.pivotY);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(f.pivotX, f.pivotY, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawLauncher() {
    const centerX = (chute.left + chute.right) / 2;
    const baseY = chute.bottom - 7;
    const springLength = 25 - launcherPower * 0.12;

    ctx.save();

    ctx.strokeStyle = "#a8b6d8";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(centerX, baseY);
    ctx.lineTo(centerX, baseY - springLength);
    ctx.stroke();

    ctx.strokeStyle = "#ffcf55";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(centerX, baseY);

    const turns = 7;
    for (let i = 1; i <= turns; i++) {
        const y = baseY - springLength * i / turns;
        const x = centerX + (i % 2 === 0 ? -5 : 5);
        ctx.lineTo(x, y);
    }

    ctx.stroke();
    ctx.restore();
}

function drawBall() {
    ctx.save();

    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 14;

    const g = ctx.createRadialGradient(
        ball.x - 3, ball.y - 4, 1,
        ball.x, ball.y, ball.radius
    );

    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.45, "#dceaff");
    g.addColorStop(1, "#6879a8");

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawGameOver() {
    if (!gameOver) return;

    ctx.fillStyle = "#000000bb";
    ctx.fillRect(20, 240, 290, 100);

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd45c";
    ctx.font = "bold 26px Arial";
    ctx.fillText("FIM DE JOGO", 165, 280);

    ctx.fillStyle = "white";
    ctx.font = "16px Arial";
    ctx.fillText("Toque em REINICIAR", 165, 310);
    ctx.textAlign = "left";
}

function draw() {
    drawBackground();
    drawPegs();
    drawBumpers();

    drawFlipper(flippers.left, "#34d9ff");
    drawFlipper(flippers.right, "#ff4fb8");

    drawLauncher();
    drawBall();
    drawGameOver();

    if (launcherHeld && ball.inChute) {
        ctx.fillStyle = "#ffd45c";
        ctx.font = "bold 12px Arial";
        ctx.fillText("MOLA: " + Math.floor(launcherPower) + "%", 12, H - 28);
    }
}

function loop() {
    update();
    draw();
    animationId = requestAnimationFrame(loop);
}

// Controles dos flippers.
function bindHold(buttonId, onDown, onUp) {
    const button = document.getElementById(buttonId);

    button.addEventListener("pointerdown", event => {
        event.preventDefault();
        onDown();
    });

    button.addEventListener("pointerup", event => {
        event.preventDefault();
        onUp();
    });

    button.addEventListener("pointercancel", onUp);
    button.addEventListener("pointerleave", onUp);
}

bindHold("leftBtn",
    () => { leftHeld = true; initAudio(); },
    () => { leftHeld = false; }
);

bindHold("rightBtn",
    () => { rightHeld = true; initAudio(); },
    () => { rightHeld = false; }
);

// Lançador: segurar comprime a mola; soltar dispara.
const launchBtn = document.getElementById("launchBtn");

launchBtn.addEventListener("pointerdown", event => {
    event.preventDefault();
    startLauncher();
});

launchBtn.addEventListener("pointerup", event => {
    event.preventDefault();
    releaseLauncher();
});

launchBtn.addEventListener("pointercancel", releaseLauncher);
launchBtn.addEventListener("pointerleave", () => {
    if (launcherHeld) releaseLauncher();
});

document.getElementById("restartBtn").addEventListener("click", () => {
    initAudio();
    restartGame();
});

restartGame();
loop();
</script>

</body>
</html>
