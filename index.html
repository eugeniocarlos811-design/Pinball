<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Super Pinball Arcade V8</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #101426;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100dvh;
    overflow-x: hidden;
    padding: 4px;
}

h1 {
    font-size: clamp(19px, 5vw, 27px);
    margin: 4px 0;
    color: #ffe66d;
}

.info {
    display: flex;
    justify-content: center;
    gap: 13px;
    flex-wrap: wrap;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
}

.info span {
    color: #71f6ff;
}

#game {
    display: block;
    margin: 0 auto;
    width: min(98vw, 520px);
    height: auto;
    max-height: 65dvh;
    aspect-ratio: 400 / 700;
    border: 3px solid #5deaff;
    border-radius: 9px;
    background: #080d20;
    box-shadow: 0 0 12px #00d9ff70;
    touch-action: none;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    margin: 7px auto 4px;
    max-width: 520px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 8px 11px;
    font-size: 14px;
    font-weight: bold;
    color: #101426;
    background: #ffe66d;
    box-shadow: 0 3px 0 #b89e36;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}

button:active,
button.active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b89e36;
    background: #71f6ff;
}

.flipper-button {
    flex: 1;
    max-width: 110px;
}

#launch {
    background: #71f6ff;
}

#restart {
    background: #ff8b8b;
}

#update {
    display: block;
    margin: 6px auto;
    padding: 8px 14px;
    font-size: 13px;
    background: #d6c4ff;
}

.tip {
    font-size: 11px;
    color: #c9d4ee;
    margin: 4px auto;
    max-width: 500px;
}

@media (max-height: 650px) {
    h1 {
        font-size: 18px;
        margin: 2px;
    }

    .info {
        margin-bottom: 3px;
        font-size: 12px;
    }

    #game {
        max-height: 55dvh;
    }

    button {
        padding: 7px 9px;
        font-size: 13px;
    }

    .controls {
        margin: 5px auto 3px;
    }

    #update {
        margin: 4px auto;
        padding: 6px 12px;
    }
}
</style>
</head>

<body>

<h1>🎯 Super Pinball Arcade</h1>

<div class="info">
    <div>Pontos: <span id="score">0</span></div>
    <div>Recorde: <span id="record">0</span></div>
    <div>Bolas: <span id="balls">3</span></div>
</div>

<canvas id="game" width="400" height="700"></canvas>

<div class="controls">
    <button id="leftBtn" class="flipper-button">◀ ESQ.</button>
    <button id="launch">LANÇAR</button>
    <button id="rightBtn" class="flipper-button">DIR. ▶</button>
</div>

<div class="controls">
    <button id="restart">🔄 Reiniciar</button>
</div>

<div class="tip">
    Segure ESQ. e DIR. para rebater a bola. Toque em LANÇAR para começar.
</div>

<button id="update">🔄 ATUALIZAR JOGO</button>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const recordText = document.getElementById("record");
const ballsText = document.getElementById("balls");

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const launchBtn = document.getElementById("launch");
const restartBtn = document.getElementById("restart");
const updateBtn = document.getElementById("update");

const W = canvas.width;
const H = canvas.height;

const BALL_RADIUS = 7;
const MAX_SPEED = 12;
const GRAVITY = 0.13;

// Corredor de lançamento.
// A barra fica à esquerda do corredor e tem
// uma abertura superior para a bola entrar no tabuleiro.
const CORRIDOR_X = 320;
const CORRIDOR_WALL_TOP = 480;
const CORRIDOR_WALL_BOTTOM = 610;

let score = 0;
let balls = 3;
let record = 0;
let gameOver = false;
let ballInPlay = false;
let launchReady = true;
let leftPressed = false;
let rightPressed = false;
let lastTime = 0;
let audioContext = null;

try {
    record = Number(localStorage.getItem("pinballRecordV8")) || 0;
} catch (error) {
    record = 0;
}

recordText.textContent = record;

const ball = {
    x: 355,
    y: 585,
    vx: 0,
    vy: 0,
    r: BALL_RADIUS
};

const leftFlipper = {
    x: 112,
    y: 595,
    length: 76,
    radius: 10,
    restAngle: 0.20,
    raisedAngle: -0.42,
    lastHit: 0
};

const rightFlipper = {
    x: 288,
    y: 595,
    length: 76,
    radius: 10,
    restAngle: Math.PI - 0.20,
    raisedAngle: Math.PI + 0.42,
    lastHit: 0
};

const bumpers = [
    { x: 110, y: 150, r: 22 },
    { x: 275, y: 190, r: 22 },
    { x: 190, y: 275, r: 24 },
    { x: 95, y: 355, r: 18 },
    { x: 300, y: 365, r: 19 }
];

const pins = [
    { x: 185, y: 100, r: 6 },
    { x: 225, y: 120, r: 6 },
    { x: 65, y: 215, r: 6 },
    { x: 155, y: 210, r: 6 },
    { x: 235, y: 245, r: 6 },
    { x: 305, y: 265, r: 6 },
    { x: 155, y: 330, r: 6 },
    { x: 225, y: 345, r: 6 },
    { x: 255, y: 420, r: 6 },
    { x: 125, y: 430, r: 6 },
    { x: 190, y: 455, r: 6 }
];

function getFlipperSegment(flipper, pressed) {
    const angle = pressed
        ? flipper.raisedAngle
        : flipper.restAngle;

    return {
        x1: flipper.x,
        y1: flipper.y,
        x2: flipper.x + Math.cos(angle) * flipper.length,
        y2: flipper.y + Math.sin(angle) * flipper.length,
        radius: flipper.radius
    };
}

function limitSpeed() {
    const speed = Math.hypot(ball.vx, ball.vy);

    if (speed > MAX_SPEED) {
        ball.vx = ball.vx / speed * MAX_SPEED;
        ball.vy = ball.vy / speed * MAX_SPEED;
    }
}

function addScore(points) {
    score += points;
    scoreText.textContent = score;

    if (score > record) {
        record = score;
        recordText.textContent = record;

        try {
            localStorage.setItem("pinballRecordV8", String(record));
        } catch (error) {}
    }
}

function playSound(frequency = 440, duration = 0.07) {
    try {
        if (!audioContext) {
            audioContext = new (
                window.AudioContext || window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = frequency;
        gain.gain.value = 0.06;

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + duration
        );

        oscillator.stop(audioContext.currentTime + duration);
    } catch (error) {}
}

function resetBall() {
    ball.x = 355;
    ball.y = 585;
    ball.vx = 0;
    ball.vy = 0;

    ballInPlay = false;
    launchReady = true;

    leftPressed = false;
    rightPressed = false;

    leftBtn.classList.remove("active");
    rightBtn.classList.remove("active");
}

function launchBall() {
    if (gameOver || balls <= 0 || ballInPlay || !launchReady) {
        return;
    }

    launchReady = false;
    ballInPlay = true;

    // Bola começa no corredor.
    ball.x = 355;
    ball.y = 585;

    // Sobe rapidamente e segue para a abertura superior.
    ball.vx = -2.5;
    ball.vy = -11.5;

    playSound(420, 0.14);
}

function loseBall() {
    if (!ballInPlay) return;

    ballInPlay = false;
    balls = Math.max(0, balls - 1);
    ballsText.textContent = balls;

    playSound(180, 0.18);

    if (balls <= 0) {
        gameOver = true;
        return;
    }

    resetBall();
}

function restartGame() {
    score = 0;
    balls = 3;
    gameOver = false;

    scoreText.textContent = score;
    ballsText.textContent = balls;

    resetBall();
}

function circleCollision(object, points = 10) {
    const dx = ball.x - object.x;
    const dy = ball.y - object.y;
    const distance = Math.hypot(dx, dy);
    const minDistance = ball.r + object.r;

    if (distance >= minDistance) return;

    const nx = distance > 0.001 ? dx / distance : 0;
    const ny = distance > 0.001 ? dy / distance : -1;

    ball.x = object.x + nx * (minDistance + 0.5);
    ball.y = object.y + ny * (minDistance + 0.5);

    const vn = ball.vx * nx + ball.vy * ny;

    if (vn < 0) {
        ball.vx -= 1.8 * vn * nx;
        ball.vy -= 1.8 * vn * ny;
    }

    ball.vx += nx * 0.7;
    ball.vy += ny * 0.7;

    limitSpeed();
    addScore(points);
    playSound(650, 0.05);
}

function collideWithLine(x1, y1, x2, y2, radius = 5) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len2 = dx * dx + dy * dy;

    if (len2 === 0) return;

    let t = (
        (ball.x - x1) * dx +
        (ball.y - y1) * dy
    ) / len2;

    t = Math.max(0, Math.min(1, t));

    const px = x1 + t * dx;
    const py = y1 + t * dy;

    let vx = ball.x - px;
    let vy = ball.y - py;

    const dist = Math.hypot(vx, vy);
    const minDist = ball.r + radius;

    if (dist >= minDist) return;

    if (dist < 0.001) {
        vx = -dy;
        vy = dx;
    }

    const normalLength = Math.hypot(vx, vy) || 1;
    const nx = vx / normalLength;
    const ny = vy / normalLength;

    ball.x = px + nx * (minDist + 0.5);
    ball.y = py + ny * (minDist + 0.5);

    const vn = ball.vx * nx + ball.vy * ny;

    if (vn < 0) {
        ball.vx -= 1.75 * vn * nx;
        ball.vy -= 1.75 * vn * ny;
    }
}

function collideWithFlipper(flipper, pressed, isLeft, now) {
    if (!ballInPlay) return;

    const seg = getFlipperSegment(flipper, pressed);
    const dx = seg.x2 - seg.x1;
    const dy = seg.y2 - seg.y1;
    const len2 = dx * dx + dy * dy;

    let t = (
        (ball.x - seg.x1) * dx +
        (ball.y - seg.y1) * dy
    ) / len2;

    t = Math.max(0, Math.min(1, t));

    const nearestX = seg.x1 + t * dx;
    const nearestY = seg.y1 + t * dy;

    let diffX = ball.x - nearestX;
    let diffY = ball.y - nearestY;

    let distance = Math.hypot(diffX, diffY);
    const minDistance = ball.r + seg.radius;

    if (distance >= minDistance) return;

    if (distance < 0.001) {
        diffX = 0;
        diffY = -1;
        distance = 1;
    }

    const nx = diffX / distance;
    const ny = diffY / distance;

    ball.x = nearestX + nx * (minDistance + 0.5);
    ball.y = nearestY + ny * (minDistance + 0.5);

    const vn = ball.vx * nx + ball.vy * ny;

    if (vn < 0) {
        ball.vx -= 1.8 * vn * nx;
        ball.vy -= 1.8 * vn * ny;
    }

    if (pressed && now - flipper.lastHit > 100) {
        ball.vy = Math.min(ball.vy, -10.5);
        ball.vx += isLeft ? 2.2 : -2.2;

        flipper.lastHit = now;
        addScore(10);
        playSound(520, 0.06);
    }

    limitSpeed();
}

function updatePhysics(dt) {
    if (!ballInPlay || gameOver) return;

    const now = performance.now();
    const steps = Math.max(1, Math.ceil(dt / 2));
    const step = dt / steps;

    for (let i = 0; i < steps; i++) {
        ball.vy += GRAVITY * step;

        ball.x += ball.vx * step;
        ball.y += ball.vy * step;

        // Paredes externas.
        if (ball.x - ball.r < 12) {
            ball.x = 12 + ball.r;
            ball.vx = Math.abs(ball.vx) * 0.85;
        }

        if (ball.x + ball.r > 388) {
            ball.x = 388 - ball.r;
            ball.vx = -Math.abs(ball.vx) * 0.85;
        }

        if (ball.y - ball.r < 12) {
            ball.y = 12 + ball.r;
            ball.vy = Math.abs(ball.vy) * 0.85;
        }

        // Trilhos inferiores diagonais.
        collideWithLine(22, 480, 88, 540, 5);
        collideWithLine(378, 480, 312, 540, 5);

        /*
          BARREIRA DO CORREDOR:
          Existe somente entre Y=480 e Y=610.
          A abertura acima de Y=480 permite que a bola
          atravesse para o tabuleiro.
        */
        collideWithLine(
            CORRIDOR_X,
            CORRIDOR_WALL_TOP,
            CORRIDOR_X,
            CORRIDOR_WALL_BOTTOM,
            3
        );

        for (const pin of pins) {
            circleCollision(pin, 5);
        }

        for (const bumper of bumpers) {
            circleCollision(bumper, 25);
        }

        collideWithFlipper(leftFlipper, leftPressed, true, now);
        collideWithFlipper(rightFlipper, rightPressed, false, now);

        limitSpeed();

        if (ball.y - ball.r > H) {
            loseBall();
            return;
        }
    }
}

function drawFlipper(flipper, pressed) {
    const seg = getFlipperSegment(flipper, pressed);

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineWidth = flipper.radius * 2;
    ctx.strokeStyle = pressed ? "#fff36d" : "#ff9e43";

    ctx.beginPath();
    ctx.moveTo(seg.x1, seg.y1);
    ctx.lineTo(seg.x2, seg.y2);
    ctx.stroke();

    ctx.lineWidth = 2;
    ctx.strokeStyle = "#fff8d0";

    ctx.beginPath();
    ctx.moveTo(seg.x1, seg.y1);
    ctx.lineTo(seg.x2, seg.y2);
    ctx.stroke();

    ctx.restore();
}

function drawPivot(flipper) {
    ctx.beginPath();
    ctx.arc(flipper.x, flipper.y, 12, 0, Math.PI * 2);
    ctx.fillStyle = "#c3d8ff";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(flipper.x, flipper.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#465a8d";
    ctx.fill();
}

function drawBoard() {
    ctx.clearRect(0, 0, W, H);

    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#101b40");
    gradient.addColorStop(1, "#080b19");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Contorno superior e parede direita externa.
    ctx.strokeStyle = "#3ee8ff";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(12, 12);
    ctx.lineTo(388, 12);
    ctx.lineTo(388, 620);
    ctx.stroke();

    // Parede esquerda.
    ctx.beginPath();
    ctx.moveTo(12, 12);
    ctx.lineTo(12, 480);
    ctx.lineTo(88, 540);
    ctx.stroke();

    /*
      CORREDOR VISÍVEL:
      A barra lilás antiga foi substituída por esta
      barreira mais à esquerda, começando em Y=480.
      A abertura superior fica livre para a bola entrar.
    */
    ctx.strokeStyle = "#b98cff";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(CORRIDOR_X, CORRIDOR_WALL_TOP);
    ctx.lineTo(CORRIDOR_X, CORRIDOR_WALL_BOTTOM);
    ctx.stroke();

    // Trilhos diagonais.
    ctx.strokeStyle = "#6578c9";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(22, 480);
    ctx.lineTo(88, 540);
    ctx.stroke();

    // O trilho direito termina antes do corredor.
    ctx.beginPath();
    ctx.moveTo(378, 480);
    ctx.lineTo(340, 515);
    ctx.stroke();

    // Pinos.
    for (const pin of pins) {
        ctx.beginPath();
        ctx.arc(pin.x, pin.y, pin.r, 0, Math.PI * 2);
        ctx.fillStyle = "#e4edff";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(pin.x - 2, pin.y - 2, 2, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
    }

    // Bumpers.
    for (const bumper of bumpers) {
        const g = ctx.createRadialGradient(
            bumper.x - 6,
            bumper.y - 6,
            2,
            bumper.x,
            bumper.y,
            bumper.r
        );

        g.addColorStop(0, "#ffffff");
        g.addColorStop(0.3, "#ffec72");
        g.addColorStop(1, "#ff6a00");

        ctx.beginPath();
        ctx.arc(bumper.x, bumper.y, bumper.r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();

        ctx.strokeStyle = "#fff3b0";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    drawFlipper(leftFlipper, leftPressed);
    drawFlipper(rightFlipper, rightPressed);

    drawPivot(leftFlipper);
    drawPivot(rightFlipper);

    if (!ballInPlay && !gameOver) {
        ctx.fillStyle = "#a7b2d1";
        ctx.font = "12px Arial";
        ctx.textAlign = "center";
        ctx.fillText("TOQUE EM LANÇAR", 355, 650);
    }

    if (ballInPlay) {
        const g = ctx.createRadialGradient(
            ball.x - 3,
            ball.y - 4,
            1,
            ball.x,
            ball.y,
            ball.r + 2
        );

        g.addColorStop(0, "#ffffff");
        g.addColorStop(0.45, "#e1f6ff");
        g.addColorStop(1, "#53cfff");

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.78)";
        ctx.fillRect(25, 260, 350, 120);

        ctx.fillStyle = "#ffe66d";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.fillText("FIM DE JOGO", 200, 310);

        ctx.fillStyle = "#ffffff";
        ctx.font = "18px Arial";
        ctx.fillText("Toque em Reiniciar", 200, 350);
    }
}

function setupFlipperButton(button, side) {
    function press(event) {
        event.preventDefault();

        if (side === "left") {
            leftPressed = true;
        } else {
            rightPressed = true;
        }

        button.classList.add("active");
    }

    function release(event) {
        if (event) event.preventDefault();

        if (side === "left") {
            leftPressed = false;
        } else {
            rightPressed = false;
        }

        button.classList.remove("active");
    }

    button.addEventListener("pointerdown", press);
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);

    window.addEventListener("pointerup", release);
    window.addEventListener("blur", release);
}

function gameLoop(timestamp) {
    if (!lastTime) {
        lastTime = timestamp;
    }

    let dt = timestamp - lastTime;
    lastTime = timestamp;

    dt = Math.min(dt, 12);

    updatePhysics(dt / 16.67);
    drawBoard();

    requestAnimationFrame(gameLoop);
}

setupFlipperButton(leftBtn, "left");
setupFlipperButton(rightBtn, "right");

launchBtn.addEventListener("pointerdown", function(event) {
    event.preventDefault();
    launchBall();
});

restartBtn.addEventListener("click", restartGame);

updateBtn.addEventListener("click", function() {
    const url = new URL(window.location.href);
    url.searchParams.set("atualizar", Date.now());
    window.location.replace(url.toString());
});

canvas.addEventListener("contextmenu", function(event) {
    event.preventDefault();
});

resetBall();
drawBoard();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
