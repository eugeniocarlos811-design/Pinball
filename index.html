<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101e">
<title>Super Pinball Arcade</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #07101e;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100dvh;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 10px calc(12px + env(safe-area-inset-bottom));
    overflow-x: hidden;
}

header {
    width: 100%;
    text-align: center;
    flex-shrink: 0;
}

h1 {
    color: #39e6ff;
    font-size: clamp(19px, 5vw, 30px);
    text-shadow: 0 0 12px #00aaff;
    margin: 3px 0 6px;
}

.info {
    display: flex;
    justify-content: center;

}

#game {
    display: block;
    width: auto;
    height: auto;
    max-width: 94vw;
    max-height: 54dvh;
    max-height: 54vh;
    aspect-ratio: 400 / 650;
    border: 3px solid #29cfff;
    border-radius: 12px;
    background: #081a33;

}

#leftBtn, #rightBtn {

@media (max-height: 650px) {
    body { padding-top: 3px; }
    h1 { font-size: 19px; margin: 1px 0 3px; }
    .info { margin-bottom: 3px; font-size: 13px; }
    #game { max-height: 43vh; }
    .controls { margin-top: 5px; gap: 5px; }
    button { min-height: 38px; padding: 6px; font-size: 13px; }
    #updatePageBtn { margin-top: 5px; min-height: 38px; }
    .tip { margin-top: 4px; }
}
</style>
</head>

<body>

<header>
    <h1>🎮 SUPER PINBALL ARCADE</h1>
    <div class="info">
        <div>PONTOS: <span id="score">0</span></div>
        <div>RECORDE: <span id="record">0</span></div>
        <div>BOLAS: <span id="balls">3</span></div>
    </div>
</header>

<canvas id="game" width="400" height="650"></canvas>

<div class="controls">
    <button id="leftBtn" type="button">◀ FLIPER</button>
    <button id="rightBtn" type="button">FLIPER ▶</button>
    <button id="launchBtn" type="button">🚀 LANÇAR BOLA</button>
    <button id="restartBtn" type="button">🔄 REINICIAR</button>
</div>

<button id="updatePageBtn" type="button">🌐 ATUALIZAR SITE</button>

<div class="tip">
    Toque em LANÇAR BOLA para começar.<br>
    Segure os botões FLIPER para rebater a bola.
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const recordText = document.getElementById("record");
const ballsText = document.getElementById("balls");

const W = 400;
const H = 650;

let score = 0;
let balls = 3;
let record = 0;
let gameOver = false;
let ballInLauncher = true;
let leftPressed = false;
let rightPressed = false;
let lastTime = 0;
let animationId = null;

try {
    record = Number(localStorage.getItem("pinballRecord")) || 0;
} catch (e) {
    record = 0;
}
recordText.textContent = record;

const ball = {
    x: 350,
    y: 555,
    vx: 0,
    vy: 0,
    r: 9
};

const bumpers = [
    {x: 115, y: 180, r: 30, color: "#ff3c89"},
    {x: 250, y: 220, r: 31, color: "#25dfff"},
    {x: 180, y: 310, r: 28, color: "#ffe24a"}
];

const leftFlipper = {
    x: 115, y: 535, length: 83, angle: 0.25
};

const rightFlipper = {
    x: 285, y: 535, length: 83, angle: Math.PI - 0.25
};

function updateText() {
    scoreText.textContent = score;
    ballsText.textContent = balls;
    recordText.textContent = record;
}

function saveRecord() {
    if (score > record) {
        record = score;
        try {
            localStorage.setItem("pinballRecord", String(record));
        } catch (e) {}
    }
    updateText();
}

function resetBall() {
    ball.x = 350;
    ball.y = 555;
    ball.vx = 0;
    ball.vy = 0;
    ballInLauncher = true;
}

function restartGame() {
    score = 0;
    balls = 3;
    gameOver = false;
    leftPressed = false;
    rightPressed = false;
    resetBall();
    updateText();
    draw();
}

function launchBall() {
    if (gameOver) {
        restartGame();
    }

    if (ballInLauncher) {
        ballInLauncher = false;
        ball.vx = -2.2;
        ball.vy = -10.5;
    }
}

function loseBall() {
    if (gameOver) return;

    balls--;
    saveRecord();

    if (balls <= 0) {
        balls = 0;
        gameOver = true;
        ballInLauncher = false;
    } else {
        resetBall();
    }

    updateText();
}

function addPoints(amount) {
    score += amount;
    saveRecord();
}

function drawCircle(x, y, r, color, glow = 0) {
    ctx.save();
    if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = glow;
    }
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
}

function drawLine(x1, y1, x2, y2, color, width) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.stroke();
}

function drawFlipper(f, isLeft, pressed) {
    const angle = isLeft
        ? (pressed ? -0.43 : 0.25)
        : (pressed ? Math.PI + 0.43 : Math.PI - 0.25);

    const x2 = f.x + Math.cos(angle) * f.length;
    const y2 = f.y + Math.sin(angle) * f.length;

    drawLine(f.x, f.y, x2, y2, "#08101c", 24);
    drawLine(f.x, f.y, x2, y2, pressed ? "#fff36b" : "#ffb52e", 15);
    drawCircle(f.x, f.y, 13, "#e9f8ff");
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#102b52");
    bg.addColorStop(1, "#050b19");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Bordas da mesa
    drawLine(20, 20, 20, 585, "#27dfff", 5);
    drawLine(20, 20, 380, 20, "#27dfff", 5);
    drawLine(380, 20, 380, 585, "#27dfff", 5);
    drawLine(20, 585, 100, 625, "#27dfff", 5);
    drawLine(380, 585, 300, 625, "#27dfff", 5);
    drawLine(100, 625, 300, 625, "#27dfff", 5);

    // Guia de lançamento
    drawLine(340, 65, 340, 555, "#9bb8dc", 2);
    drawLine(365, 65, 365, 555, "#9bb8dc", 2);

    // Luzes e bumpers
    bumpers.forEach((b, i) => {
        drawCircle(b.x, b.y, b.r + 7, "#193c61");
        drawCircle(b.x, b.y, b.r, b.color, 15);
        drawCircle(b.x - 7, b.y - 7, 7, "#ffffff");
        ctx.fillStyle = "#07101e";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.fillText("+", b.x, b.y + 6);
    });

    // Obstáculos
    drawLine(45, 390, 105, 435, "#f7c64a", 9);
    drawLine(355, 390, 295, 435, "#f7c64a", 9);
    drawCircle(45, 390, 8, "#ffffff");
    drawCircle(355, 390, 8, "#ffffff");

    // Flippers
    drawFlipper(leftFlipper, true, leftPressed);
    drawFlipper(rightFlipper, false, rightPressed);

    // Bola
    drawCircle(ball.x, ball.y, ball.r + 2, "#a6d8ff", 9);
    drawCircle(ball.x - 2, ball.y - 2, ball.r - 2, "#ffffff");

    // Mensagem de estado
    ctx.textAlign = "center";
    if (gameOver) {
        ctx.fillStyle = "#ff5577";
        ctx.font = "bold 31px Arial";
        ctx.fillText("FIM DE JOGO", 200, 295);
        ctx.fillStyle = "#ffffff";
        ctx.font = "18px Arial";
        ctx.fillText("Toque em REINICIAR", 200, 330);
    } else if (ballInLauncher) {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px Arial";
        ctx.fillText("TOQUE EM LANÇAR BOLA", 205, 490);
        ctx.fillText("PARA COMEÇAR!", 205, 513);
    }

    ctx.textAlign = "start";
}

function hitBumper(b) {
    const dx = ball.x - b.x;
    const dy = ball.y - b.y;
    const distance = Math.hypot(dx, dy);
    const minDistance = ball.r + b.r;

    if (distance < minDistance && distance > 0) {
        const nx = dx / distance;
        const ny = dy / distance;

        ball.x = b.x + nx * (minDistance + 1);
        ball.y = b.y + ny * (minDistance + 1);

        const speed = ball.vx * nx + ball.vy * ny;
        if (speed < 0) {
            ball.vx -= 2 * speed * nx;
            ball.vy -= 2 * speed * ny;
        }

        ball.vx += nx * 2.5;
        ball.vy += ny * 2.5;

        limitSpeed();
        addPoints(100);
    }
}

function limitSpeed() {
    const maxSpeed = 13;
    const speed = Math.hypot(ball.vx, ball.vy);

    if (speed > maxSpeed) {
        ball.vx = ball.vx / speed * maxSpeed;
        ball.vy = ball.vy / speed * maxSpeed;
    }
}

function hitFlipper(f, isLeft, pressed) {
    const angle = isLeft
        ? (pressed ? -0.43 : 0.25)
        : (pressed ? Math.PI + 0.43 : Math.PI - 0.25);

    const x2 = f.x + Math.cos(angle) * f.length;
    const y2 = f.y + Math.sin(angle) * f.length;

    const dx = x2 - f.x;
    const dy = y2 - f.y;
    const lengthSq = dx * dx + dy * dy;

    let t = ((ball.x - f.x) * dx + (ball.y - f.y) * dy) / lengthSq;
    t = Math.max(0, Math.min(1, t));

    const px = f.x + t * dx;
    const py = f.y + t * dy;
    const distX = ball.x - px;
    const distY = ball.y - py;
    const distance = Math.hypot(distX, distY);

    if (distance < ball.r + 8 && distance > 0) {
        const nx = distX / distance;
        const ny = distY / distance;

        ball.x = px + nx * (ball.r + 9);
        ball.y = py + ny * (ball.r + 9);

        if (pressed) {
            ball.vy = -10.5;
            ball.vx += isLeft ? 2.4 : -2.4;
        } else {
            ball.vx += nx * 2;
            ball.vy += ny * 2;
        }

        limitSpeed();
        addPoints(10);
    }
}

function update(dt) {
    if (gameOver || ballInLauncher) return;

    const step = Math.min(dt, 2.2);

    // Gravidade moderada
    ball.vy += 0.20 * step;
    ball.x += ball.vx * step;
    ball.y += ball.vy * step;

    // Paredes
    if (ball.x - ball.r < 24) {
        ball.x = 24 + ball.r;
        ball.vx = Math.abs(ball.vx) * 0.82;
    }

    if (ball.x + ball.r > 376) {
        ball.x = 376 - ball.r;
        ball.vx = -Math.abs(ball.vx) * 0.82;
    }

    if (ball.y - ball.r < 25) {
        ball.y = 25 + ball.r;
        ball.vy = Math.abs(ball.vy) * 0.8;
    }

    // Obstáculos inclinados
    if (ball.y > 380 && ball.y < 450) {
        if (ball.x < 105 && ball.x > 40) {
            ball.vx = Math.abs(ball.vx) + 1;
            ball.vy = -Math.abs(ball.vy) * 0.8;
        }

        if (ball.x > 295 && ball.x < 360) {
            ball.vx = -Math.abs(ball.vx) - 1;
            ball.vy = -Math.abs(ball.vy) * 0.8;
        }
    }

    bumpers.forEach(hitBumper);

    hitFlipper(leftFlipper, true, leftPressed);
    hitFlipper(rightFlipper, false, rightPressed);

    // Evita velocidade excessiva
    limitSpeed();

    // Bola perdida
    if (ball.y > H + 20) {
        loseBall();
    }
}

function loop(time) {
    if (!lastTime) lastTime = time;

    const dt = (time - lastTime) / 16.67;
    lastTime = time;

    update(dt);
    draw();

    animationId = requestAnimationFrame(loop);
}

function setButtonHold(id, side) {
    const btn = document.getElementById(id);

    const down = (e) => {
        e.preventDefault();
        if (side === "left") leftPressed = true;
        if (side === "right") rightPressed = true;
    };

    const up = (e) => {
        e.preventDefault();
        if (side === "left") leftPressed = false;
        if (side === "right") rightPressed = false;
    };

    btn.addEventListener("pointerdown", down);
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointercancel", up);
    btn.addEventListener("pointerleave", up);
}

setButtonHold("leftBtn", "left");
setButtonHold("rightBtn", "right");

document.getElementById("launchBtn").addEventListener("click", launchBall);
document.getElementById("restartBtn").addEventListener("click", restartGame);

// Atualiza a página atual, sem sair do site
document.getElementById("updatePageBtn").addEventListener("click", () => {
    const url = new URL(window.location.href);
    url.searchParams.set("atualizar", Date.now().toString());
    window.location.replace(url.toString());
});

// Teclado para jogar no computador
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        leftPressed = true;
        e.preventDefault();
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        rightPressed = true;
        e.preventDefault();
    }

    if (e.code === "Space") {
        launchBall();
        e.preventDefault();
    }
});

document.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        leftPressed = false;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        rightPressed = false;
    }
});

// Evita que o navegador fique com a página ampliada por gestos
document.addEventListener("gesturestart", e => e.preventDefault());

updateText();
resetBall();
draw();

if (animationId !== null) {
    cancelAnimationFrame(animationId);
}
lastTime = 0;
animationId = requestAnimationFrame(loop);
</script>

</body>
</html>
