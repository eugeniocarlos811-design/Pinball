<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Super Pinball Arcade</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 10px;
    min-height: 100vh;
    background: #030814;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

#game-container {
    width: 100%;
    max-width: 420px;
    padding: 10px;
    border: 4px solid #00d8ff;
    border-radius: 16px;
    background: linear-gradient(#091227, #050a18);
    box-shadow: 0 0 20px #00aaff66;
}

.title {
    text-align: center;
    color: #ffea00;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 10px;
}

.scoreboard {
    display: flex;
    justify-content: space-between;
    padding: 8px 5px;
    margin-bottom: 10px;

}

.scoreboard span {

}

canvas {
    display: block;

    background: #030a1c;
    border: 3px solid #1a3968;
    border-radius: 10px;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    gap: 8px;
    margin-top: 12px;
}

    font-size: 13px;
    font-weight: bold;

    box-shadow: 0 4px 0 #000;
    touch-action: none;
}

.btn-yellow {
    background: linear-gradient(#fff066, #ffcc00);
}

.btn-launch {
    background: linear-gradient(#66ffff, #00ccff);
    font-size: 15px;
}

.btn-reset, .btn-update {
    grid-column: span 3;
    padding: 9px;
    color: white;
}

.btn-reset {
    background: linear-gradient(#ff6699, #ff0055);
}

.btn-update {
    background: linear-gradient(#cc66ff, #9900ff);
}

</style>

<body>

<div id="game-container">

    <div class="title">★ SUPER PINBALL ARCADE ★</div>

    <div class="scoreboard">
        <div>Pontos: <span id="score">0</span></div>
        <div>Recorde: <span id="highscore">0</span></div>
        <div>Bolas: <span id="balls">3</span></div>
    </div>

    <canvas id="canvas" width="380" height="540"></canvas>

    <div class="controls">
        <button class="btn btn-yellow" id="btn-left">◄ ESQ.</button>
        <button class="btn btn-launch" id="btn-launch">LANÇAR</button>
        <button class="btn btn-yellow" id="btn-right">DIR. ►</button>
        <button class="btn btn-reset" id="btn-reset">🔄 REINICIAR JOGO</button>
        <button class="btn btn-update" id="btn-update">⟳ ATUALIZAR JOGO</button>
    </div>

    <div class="instructions">
        Segure LANÇAR para comprimir a mola e solte para disparar.
        Use ESQ. e DIR. para rebater.
    </div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const highscoreEl = document.getElementById("highscore");
const ballsEl = document.getElementById("balls");

let score = 0;
let highscore = Number(localStorage.getItem("pinballRecord") || 0);
let balls = 3;
let gameOver = false;

highscoreEl.textContent = highscore;

// Corredor de lançamento
const chute = {
    left: 325,
    right: 365,
    top: 40,
    bottom: 515
};

const launcher = {
    x: 350,
    baseY: 510,
    compress: 0,
    maxCompress: 45
};

const ball = {
    x: 350,
    y: 470,
    vx: 0,
    vy: 0,
    radius: 8,
    inChute: true,
    active: true,

    // Enquanto true, a bola está subindo pelo corredor.
    launching: false
};

// Palhetas
const flipperLeft = {
    x: 139,
    y: 475,
    length: 42,
    radius: 6,
    angle: 0.10,
    restAngle: 0.10,
    upAngle: -0.55,
    speed: 0.32
};

const flipperRight = {
    x: 241,
    y: 475,
    length: 42,
    radius: 6,
    angle: Math.PI - 0.10,
    restAngle: Math.PI - 0.10,
    upAngle: Math.PI + 0.55,
    speed: 0.32
};

const keys = {
    left: false,
    right: false,
    launch: false
};

const bumpers = [
    {x:130, y:130, radius:22, hitTime:0},
    {x:210, y:150, radius:22, hitTime:0},
    {x:170, y:220, radius:22, hitTime:0},
    {x:110, y:270, radius:18, hitTime:0},
    {x:230, y:270, radius:18, hitTime:0}
];

const pins = [];

[
    {count:5, y:90, minX:100, maxX:240},
    {count:6, y:180, minX:80, maxX:260},
    {count:7, y:300, minX:70, maxX:280},
    {count:8, y:360, minX:60, maxX:280}
].forEach(row => {
    const step = (row.maxX-row.minX)/(row.count-1);

    for(let i=0; i<row.count; i++) {
        pins.push({
            x: row.minX+i*step,
            y: row.y,
            radius: 4
        });
    }
});

// Teclado
window.addEventListener("keydown", e => {
    if(["ArrowLeft","ArrowRight","ArrowDown"," "].includes(e.key)) {
        e.preventDefault();
    }

    if(e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
        keys.left = true;

    if(e.key === "ArrowRight" || e.key.toLowerCase() === "d")
        keys.right = true;

    if(e.key === " " || e.key === "ArrowDown")
        keys.launch = true;
});

window.addEventListener("keyup", e => {
    if(e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
        keys.left = false;

    if(e.key === "ArrowRight" || e.key.toLowerCase() === "d")
        keys.right = false;

    if(e.key === " " || e.key === "ArrowDown") {
        if(keys.launch) {
            keys.launch = false;
            releaseLauncher();
        }
    }
});

// Botões
function setupHoldButton(id, start, finish) {
    const btn = document.getElementById(id);

    btn.addEventListener("pointerdown", e => {
        e.preventDefault();

        try {
            btn.setPointerCapture(e.pointerId);
        } catch (_) {}

        start();
    });

    btn.addEventListener("pointerup", e => {
        e.preventDefault();
        finish();
    });

    btn.addEventListener("pointercancel", finish);
    btn.addEventListener("lostpointercapture", finish);
}

setupHoldButton(
    "btn-left",
    () => keys.left = true,
    () => keys.left = false
);

setupHoldButton(
    "btn-right",
    () => keys.right = true,
    () => keys.right = false
);

setupHoldButton(
    "btn-launch",
    () => keys.launch = true,
    () => {
        if(keys.launch) {
            keys.launch = false;
            releaseLauncher();
        }
    }
);

document.getElementById("btn-reset").addEventListener("click", resetGame);

document.getElementById("btn-update").addEventListener("click", () => {
    location.reload();
});

// LANÇAMENTO CORRIGIDO
function releaseLauncher() {
    if(ball.inChute && launcher.compress > 0) {
        ball.inChute = false;

        // Mantém a bola dentro do corredor durante a subida.
        ball.launching = true;
        ball.x = 350;

        // A bola sobe até a saída superior.
        ball.vx = 0;
        ball.vy = -Math.min(
            14 + launcher.compress * 0.40,
            32
        );
    }

    launcher.compress = 0;
}

function resetBall() {
    ball.x = 350;
    ball.y = 470;
    ball.vx = 0;
    ball.vy = 0;
    ball.inChute = true;
    ball.active = true;
    ball.launching = false;

    launcher.compress = 0;
    keys.launch = false;

    flipperLeft.angle = flipperLeft.restAngle;
    flipperRight.angle = flipperRight.restAngle;
}

function resetGame() {
    score = 0;
    balls = 3;
    gameOver = false;

    scoreEl.textContent = score;
    ballsEl.textContent = balls;

    resetBall();
}

function addScore(value) {
    score += value;
    scoreEl.textContent = score;

    if(score > highscore) {
        highscore = score;
        highscoreEl.textContent = highscore;
        localStorage.setItem("pinballRecord", highscore);
    }
}

// Colisão com segmento
function collideSegment(x1,y1,x2,y2,thickness,movingFlipper=false) {
    if(ball.inChute || ball.launching) return false;

    const dx = x2-x1;
    const dy = y2-y1;
    const len2 = dx*dx+dy*dy;

    if(len2 === 0) return false;

    const u = Math.max(0,Math.min(1,
        ((ball.x-x1)*dx+(ball.y-y1)*dy)/len2
    ));

    const px = x1+u*dx;
    const py = y1+u*dy;

    let nx = ball.x-px;
    let ny = ball.y-py;

    const dist = Math.hypot(nx,ny);
    const minDist = ball.radius+thickness;

    if(dist >= minDist) return false;

    if(dist > 0.001) {
        nx /= dist;
        ny /= dist;
    } else {
        const length = Math.hypot(dx,dy) || 1;
        nx = -dy/length;
        ny = dx/length;
    }

    ball.x = px+nx*(minDist+0.5);
    ball.y = py+ny*(minDist+0.5);

    const dot = ball.vx*nx+ball.vy*ny;

    if(dot < 0) {
        ball.vx -= 1.8*dot*nx;
        ball.vy -= 1.8*dot*ny;
    }

    if(movingFlipper) ball.vy -= 1;

    return true;
}

function collideFlipper(f,isLeft) {
    if(ball.launching) return;

    const x2 = f.x+Math.cos(f.angle)*f.length;
    const y2 = f.y+Math.sin(f.angle)*f.length;

    const hit = collideSegment(
        f.x,f.y,x2,y2,f.radius,true
    );

    if(!hit) return;

    const moving = isLeft ? keys.left : keys.right;

    if(moving) {
        ball.vy = -Math.max(8,Math.abs(ball.vy)*0.45+8);
        ball.vx += isLeft ? 2.2 : -2.2;
    } else if(ball.vy > -3) {
        ball.vy = -4;
    }

    ball.vx = Math.max(-13,Math.min(13,ball.vx));
    ball.vy = Math.max(-22,Math.min(22,ball.vy));
}

function collideCircle(obj,points,power) {
    if(ball.inChute || ball.launching) return;

    let dx = ball.x-obj.x;
    let dy = ball.y-obj.y;
    let dist = Math.hypot(dx,dy);

    const minDist = ball.radius+obj.radius;

    if(dist >= minDist) return;

    if(dist < 0.001) {
        dx = 0;
        dy = -1;
        dist = 1;
    }

    const nx = dx/dist;
    const ny = dy/dist;

    ball.x = obj.x+nx*(minDist+0.5);
    ball.y = obj.y+ny*(minDist+0.5);

    const dot = ball.vx*nx+ball.vy*ny;

    if(dot < 0) {
        ball.vx -= 1.8*dot*nx;
        ball.vy -= 1.8*dot*ny;
    }

    ball.vx += nx*power;
    ball.vy += ny*power;

    if(points) addScore(points);
}

// Atualização física
function update() {
    if(gameOver) return;

    // Comprimir a mola para baixo
    if(keys.launch && ball.inChute) {
        launcher.compress = Math.min(
            launcher.maxCompress,
            launcher.compress+1
        );

        ball.y = 470+launcher.compress*0.35;
    }

    flipperLeft.angle += (
        (keys.left ? flipperLeft.upAngle : flipperLeft.restAngle)
        - flipperLeft.angle
    )*flipperLeft.speed;

    flipperRight.angle += (
        (keys.right ? flipperRight.upAngle : flipperRight.restAngle)
        - flipperRight.angle
    )*flipperRight.speed;

    if(!ball.inChute) {

        // Durante o lançamento, o corredor controla a trajetória.
        if(ball.launching) {
            ball.x = 350;
            ball.y += ball.vy;

            // Ao chegar ao topo, entra para a esquerda.
            if(ball.y-ball.radius <= chute.top) {
                ball.y = chute.top+ball.radius+1;

                ball.launching = false;

                // Impulso horizontal para entrar no tabuleiro.
                ball.vx = -7;
                ball.vy = 1.5;
            }
        } else {
            // Física normal do jogo
            const steps = 4;

            for(let s=0; s<steps; s++) {
                ball.vy += 0.20/steps;

                ball.x += ball.vx/steps;
                ball.y += ball.vy/steps;

                // Paredes
                if(ball.x-ball.radius < 20) {
                    ball.x = 20+ball.radius;
                    ball.vx = Math.abs(ball.vx)*0.82;
                }

                if(ball.y-ball.radius < 20) {
                    ball.y = 20+ball.radius;
                    ball.vy = Math.abs(ball.vy)*0.82;
                }

                // Guias inferiores
                collideSegment(20,390,139,475,3);
                collideSegment(320,390,241,475,3);

                // Pinos
                for(const p of pins) {
                    collideCircle(p,10,0.8);
                }

                // Bumpers
                for(const b of bumpers) {
                    const oldX = ball.x;
                    const oldY = ball.y;

                    collideCircle(b,0,0);

                    const dx = ball.x-b.x;
                    const dy = ball.y-b.y;

                    if(Math.hypot(dx,dy) < ball.radius+b.radius+1) {
                        const angle = Math.atan2(dy,dx);

                        ball.vx += Math.cos(angle)*2;
                        ball.vy += Math.sin(angle)*2;

                        if(b.hitTime === 0) {
                            addScore(100);
                            b.hitTime = 12;
                        }
                    }

                    if(b.hitTime > 0) b.hitTime--;
                }

                collideFlipper(flipperLeft,true);
                collideFlipper(flipperRight,false);

                ball.vx = Math.max(-15,Math.min(15,ball.vx));
                ball.vy = Math.max(-24,Math.min(24,ball.vy));
            }

            ball.vx *= 0.999;
            ball.vy *= 0.999;
        }
    }

    // Perder bola
    if(ball.y > 540) {
        balls--;
        ballsEl.textContent = balls;

        if(balls <= 0) {
            gameOver = true;
        } else {
            resetBall();
        }
    }
}

function drawFlipper(f) {
    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(f.angle);

    ctx.beginPath();
    ctx.roundRect(0,-f.radius,f.length,f.radius*2,f.radius);

    ctx.fillStyle = "#ffaa00";
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
}

function drawCompressionSpring() {
    const topY = ball.inChute
        ? ball.y+ball.radius+2
        : 500;

    const bottomY = launcher.baseY;
    const height = Math.max(8,bottomY-topY);
    const coils = 8;
    const step = height/coils;

    ctx.beginPath();
    ctx.moveTo(launcher.x,bottomY);

    for(let i=1;i<=coils;i++) {
        const y = bottomY-step*i;
        const offset = i%2===0 ? -7 : 7;

        ctx.lineTo(launcher.x+offset,y+step/2);
        ctx.lineTo(launcher.x,y);
    }

    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 3;
    ctx.shadowBlur = 6;
    ctx.shadowColor = "#00ffff";
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#ff0055";
    ctx.fillRect(launcher.x-12,bottomY,24,6);

    // Peça móvel da mola
    ctx.fillStyle = "#00ccff";
    ctx.fillRect(launcher.x-4,topY,8,8);
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = "#00aaff";
    ctx.lineWidth = 3;
    ctx.strokeRect(10,10,360,520);

    // Parede esquerda do corredor.
    // Termina na saída superior para a bola entrar no tabuleiro.
    ctx.beginPath();
    ctx.moveTo(chute.left,chute.bottom);
    ctx.lineTo(chute.left,chute.top);

    ctx.strokeStyle = "#00d8ff";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Guia superior aberta para a bola sair pela esquerda.
    ctx.beginPath();
    ctx.moveTo(chute.left,chute.top);
    ctx.quadraticCurveTo(325,15,180,15);
    ctx.quadraticCurveTo(20,15,20,120);

    ctx.strokeStyle = "#00d8ff";
    ctx.lineWidth = 4;
    ctx.stroke();

    // Parede direita do corredor
    ctx.beginPath();
    ctx.moveTo(chute.right,chute.top);
    ctx.lineTo(chute.right,chute.bottom);

    ctx.strokeStyle = "#00d8ff";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Guias inferiores
    ctx.beginPath();
    ctx.moveTo(20,390);
    ctx.lineTo(139,475);

    ctx.moveTo(320,390);
    ctx.lineTo(241,475);

    ctx.strokeStyle = "#0077ff";
    ctx.lineWidth = 5;
    ctx.stroke();

    // Pinos
    for(const p of pins) {
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);

        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 4;
        ctx.shadowColor = "#00f0ff";
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Bumpers
    for(const b of bumpers) {
        ctx.beginPath();
        ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);

        ctx.fillStyle = b.hitTime>0 ? "#ffff00" : "#ff3300";
        ctx.strokeStyle = "#ffcc00";
        ctx.lineWidth = 4;

        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "16px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("★",b.x,b.y);
    }

    drawFlipper(flipperLeft);
    drawFlipper(flipperRight);
    drawCompressionSpring();

    if(ball.active) {
        ctx.beginPath();
        ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);

        ctx.fillStyle = "#eeeeee";
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ffffff";
        ctx.fill();

        ctx.strokeStyle = "#aaaaaa";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.shadowBlur = 0;
    }

    if(ball.inChute && keys.launch) {
        ctx.fillStyle = "#00ffff";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            "FORÇA: "+Math.round(
                launcher.compress/launcher.maxCompress*100
            )+"%",
            270,430
        );
    }

    if(gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.82)";
        ctx.fillRect(10,10,360,520);

        ctx.fillStyle = "#ff0055";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("FIM DE JOGO",190,230);

        ctx.fillStyle = "#ffffff";
        ctx.font = "13px Arial";
        ctx.fillText("Toque em REINICIAR",190,270);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
