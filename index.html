<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Super Pinball Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: #030814;
      font-family: 'Arial Black', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }

    #game-container {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #091227 0%, #050a18 100%);
      border: 4px solid #00d8ff;
      border-radius: 16px;
      box-shadow: 0 0 20px #00aaff66, inset 0 0 15px #0055ff55;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      font-size: 20px;
      color: #ffea00;
      text-shadow: 0 0 8px #ffaa00, 2px 2px 0px #000;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-align: center;
    }

    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      background: #020712;
      border: 2px solid #00aaff;
      border-radius: 8px;
      padding: 6px 12px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .score-item span {
      color: #00f0ff;
      font-size: 15px;
    }

    canvas {
      background: #030a1c;
      border: 3px solid #1a3968;
      border-radius: 12px;
      box-shadow: inset 0 0 20px #000;
      width: 100%;
      max-width: 380px;
      height: auto;
      display: block;
    }

    .controls {
      width: 100%;
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 20px;
      padding: 12px 6px;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
      transition: transform 0.05s, filter 0.1s;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #000;
    }

    .btn-yellow {
      background: linear-gradient(180deg, #fff066 0%, #ffcc00 100%);
      border: 2px solid #fff;
    }
    .btn-launch {
      background: linear-gradient(180deg, #66ffff 0%, #00ccff 100%);
      border: 2px solid #fff;
      font-size: 15px;
    }
    .btn-reset {
      background: linear-gradient(180deg, #ff6699 0%, #ff0055 100%);
      border: 2px solid #fff;
      color: #fff;
      grid-column: span 3;
      margin-top: 4px;
      padding: 8px;
      font-size: 12px;
      border-radius: 12px;
    }
    .btn-update {
      background: linear-gradient(180deg, #cc66ff 100%, #9900ff 0%);
      border: 2px solid #fff;
      color: #fff;
      grid-column: span 3;
      margin-top: 4px;
      padding: 8px;
      font-size: 12px;
      border-radius: 12px;
    }

    .instructions {
      font-size: 10px;
      color: #8ab4f8;
      margin-top: 8px;
      text-align: center;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="title">★ SUPER PINBALL ARCADE ★</div>
    
    <div class="scoreboard">
      <div class="score-item">Pontos: <span id="score">0</span></div>
      <div class="score-item">Recorde: <span id="highscore">0</span></div>
      <div class="score-item">Bolas: <span id="balls">3</span></div>
    </div>

    <canvas id="canvas" width="380" height="540"></canvas>

    <div class="controls">
      <button class="btn btn-yellow" id="btn-left">◄ ESQ.</button>
      <button class="btn btn-launch" id="btn-launch">LANÇAR</button>
      <button class="btn btn-yellow" id="btn-right">DIR. ►</button>
      <button class="btn btn-reset" id="btn-reset">🔄 REINICIAR JOGO</button>
      <button class="btn btn-update" id="btn-update">⟳ ATUALIZAR JOGO</button>
    </div>

    <div class="instructions">
      Segure ESQ. e DIR. para rebater (Teclas A/D ou Setas).<br>Segure LANÇAR para comprimir a mola e solte para disparar!
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let highscore = 0;
    let balls = 3;
    let gameOver = false;

    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const ballsEl = document.getElementById('balls');

    // Mola de Compressão (X = 350)
    const launcher = {
      x: 350,
      restY: 490,      // Posição de repouso da base da mola
      compress: 0,     // Quanto a base sobe para comprimir
      maxCompress: 55,
      restHeight: 70
    };

    // Bola
    const ball = {
      x: 350,
      y: 420,
      vx: 0,
      vy: 0,
      radius: 9,
      inChute: true,
      active: true
    };

    // Flippers
    const flipperLeft = {
      x: 115, y: 465, length: 65, angle: 0.35, targetAngle: 0.35, restAngle: 0.35, upAngle: -0.35, speed: 0.3
    };
    const flipperRight = {
      x: 225, y: 465, length: 65, angle: Math.PI - 0.35, targetAngle: Math.PI - 0.35, restAngle: Math.PI - 0.35, upAngle: Math.PI + 0.35, speed: 0.3
    };

    // Bumpers
    const bumpers = [
      { x: 130, y: 130, radius: 22, hitTime: 0 },
      { x: 210, y: 150, radius: 22, hitTime: 0 },
      { x: 170, y: 220, radius: 22, hitTime: 0 },
      { x: 110, y: 270, radius: 18, hitTime: 0 },
      { x: 230, y: 270, radius: 18, hitTime: 0 }
    ];

    // Pinos fixos
    const pins = [];
    const pinRows = [
      { count: 5, y: 90, minX: 100, maxX: 240 },
      { count: 6, y: 180, minX: 80, maxX: 260 },
      { count: 7, y: 300, minX: 70, maxX: 270 },
      { count: 8, y: 360, minX: 60, maxX: 280 }
    ];

    pinRows.forEach(row => {
      let step = (row.maxX - row.minX) / (row.count - 1);
      for(let i=0; i<row.count; i++) {
        pins.push({ x: row.minX + i*step, y: row.y, radius: 4 });
      }
    });

    const keys = { left: false, right: false, launch: false };

    // Eventos de Teclado
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === ' ' || e.key === 'ArrowDown') {
        keys.launch = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      if (e.key === ' ' || e.key === 'ArrowDown') {
        if (keys.launch) {
          keys.launch = false;
          releaseLauncher();
        }
      }
    });

    // Controles Touch / Mouse
    function setupButton(id, onStart, onEnd) {
      const btn = document.getElementById(id);
      if(!btn) return;
      const start = (e) => { e.preventDefault(); onStart(); };
      const end = (e) => { e.preventDefault(); onEnd(); };

      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', end);
    }

    setupButton('btn-left', () => keys.left = true, () => keys.left = false);
    setupButton('btn-right', () => keys.right = true, () => keys.right = false);
    setupButton('btn-launch', () => keys.launch = true, () => {
      keys.launch = false;
      releaseLauncher();
    });

    document.getElementById('btn-reset').addEventListener('click', resetGame);
    document.getElementById('btn-update').addEventListener('click', () => {
      window.location.reload();
    });

    function releaseLauncher() {
      if (ball.inChute && launcher.compress > 5) {
        ball.vy = -Math.min(launcher.compress * 0.48, 28);
        ball.vx = 0;
        ball.inChute = false;
      }
      launcher.compress = 0;
    }

    function resetGame() {
      score = 0;
      balls = 3;
      gameOver = false;
      scoreEl.innerText = score;
      ballsEl.innerText = balls;
      resetBall();
    }

    function resetBall() {
      ball.x = 350;
      ball.y = 420;
      ball.vx = 0;
      ball.vy = 0;
      ball.inChute = true;
      ball.active = true;
      launcher.compress = 0;
    }

    function update() {
      if (gameOver) return;

      // 1. Compressão da Mola
      if (keys.launch && ball.inChute) {
        if (launcher.compress < launcher.maxCompress) {
          launcher.compress += 1.5;
        }
        // A bola acompanha a compressão da mola subindo levemente
        ball.y = 420 - launcher.compress;
      }

      // 2. Movimento dos Flippers
      flipperLeft.targetAngle = keys.left ? flipperLeft.upAngle : flipperLeft.restAngle;
      flipperLeft.angle += (flipperLeft.targetAngle - flipperLeft.angle) * flipperLeft.speed;

      flipperRight.targetAngle = keys.right ? flipperRight.upAngle : flipperRight.restAngle;
      flipperRight.angle += (flipperRight.targetAngle - flipperRight.angle) * flipperRight.speed;

      // 3. Física da Bola no Campo
      if (!ball.inChute) {
        ball.vy += 0.28; // Gravidade
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Atrito
        ball.vx *= 0.993;
        ball.vy *= 0.993;
      }

      // 4. Colisões Rígidas com as Paredes do Tabuleiro
      // Parede Esquerda Externa
      if (ball.x - ball.radius < 20) {
        ball.x = 20 + ball.radius;
        ball.vx = Math.abs(ball.vx) * 0.75;
      }
      // Parede Direita Externa (Fora do canal)
      if (!ball.inChute && ball.x + ball.radius > 360 && ball.y > 60) {
        ball.x = 360 - ball.radius;
        ball.vx = -Math.abs(ball.vx) * 0.75;
      }
      // Teto Superior Curvado
      if (ball.y - ball.radius < 20) {
        ball.y = 20 + ball.radius;
        ball.vy = Math.abs(ball.vy) * 0.75;
      }

      // Canaleta Direita (Separador em X = 325)
      if (!ball.inChute) {
        // Se a bola estiver subindo ou descendo pelo corredor direito
        if (ball.x > 325 && ball.y < 480 && ball.y > 55) {
          if (ball.y <= 60) {
            // Saída do topo do canal para o campo principal (joga para a esquerda)
            ball.vx = -6.5;
            ball.vy = Math.min(ball.vy, -2);
          } else {
            // Mantém dentro do canal direito
            ball.x = 345;
          }
        }
      } else {
        // Presa no lançador
        ball.x = 350;
      }

      // Guias diagonais inferiores (direcionam para os flippers)
      checkLineCollision(20, 380, 115, 465);
      checkLineCollision(360, 380, 265, 465);

      // 5. Bumpers
      bumpers.forEach(b => {
        let dx = ball.x - b.x;
        let dy = ball.y - b.y;
        let dist = Math.hypot(dx, dy);
        if (dist < ball.radius + b.radius) {
          let angle = Math.atan2(dy, dx);
          let power = 11;
          ball.vx = Math.cos(angle) * power;
          ball.vy = Math.sin(angle) * power;
          b.hitTime = 12;
          score += 100;
          scoreEl.innerText = score;
          if (score > highscore) {
            highscore = score;
            highscoreEl.innerText = highscore;
          }
        }
        if (b.hitTime > 0) b.hitTime--;
      });

      // 6. Pinos
      pins.forEach(p => {
        let dx = ball.x - p.x;
        let dy = ball.y - p.y;
        let dist = Math.hypot(dx, dy);
        if (dist < ball.radius + p.radius) {
          let angle = Math.atan2(dy, dx);
          ball.vx = Math.cos(angle) * 5.5;
          ball.vy = Math.sin(angle) * 5.5;
          score += 10;
          scoreEl.innerText = score;
        }
      });

      // 7. Colisão Flippers
      checkFlipperCollision(flipperLeft, true);
      checkFlipperCollision(flipperRight, false);

      // 8. Perder Bola / Retornar ao Lançador se cair no canal inferior direito
      if (ball.y > 540) {
        balls--;
        ballsEl.innerText = balls;
        if (balls <= 0) {
          gameOver = true;
        } else {
          resetBall();
        }
      }
    }

    function checkLineCollision(x1, y1, x2, y2) {
      let dx = x2 - x1;
      let dy = y2 - y1;
      let len = Math.hypot(dx, dy);
      let u = ((ball.x - x1) * dx + (ball.y - y1) * dy) / (len * len);

      if (u >= 0 && u <= 1) {
        let px = x1 + u * dx;
        let py = y1 + u * dy;
        let dist = Math.hypot(ball.x - px, ball.y - py);

        if (dist < ball.radius + 4) {
          let angle = Math.atan2(dy, dx) + Math.PI / 2;
          ball.vx = Math.cos(angle) * 6;
          ball.vy = Math.sin(angle) * 6;
          ball.x = px + Math.cos(angle) * (ball.radius + 5);
          ball.y = py + Math.sin(angle) * (ball.radius + 5);
        }
      }
    }

    function checkFlipperCollision(f, isLeft) {
      let fx2 = f.x + Math.cos(f.angle) * f.length;
      let fy2 = f.y + Math.sin(f.angle) * f.length;
      let dx = fx2 - f.x;
      let dy = fy2 - f.y;
      let len = Math.hypot(dx, dy);
      let u = ((ball.x - f.x) * dx + (ball.y - f.y) * dy) / (len * len);

      if (u >= 0 && u <= 1) {
        let px = f.x + u * dx;
        let py = f.y + u * dy;
        let dist = Math.hypot(ball.x - px, ball.y - py);

        if (dist < ball.radius + 6) {
          let angle = Math.atan2(ball.y - py, ball.x - px);
          let impulse = (f.targetAngle !== f.restAngle) ? 16 : 8;
          ball.vx = Math.cos(angle) * impulse;
          ball.vy = Math.sin(angle) * impulse - 3;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Borda principal do pinball
      ctx.strokeStyle = '#00aaff';
      ctx.lineWidth = 3;
      ctx.strokeRect(10, 10, 360, 520);

      // Canaleta Lateral Direita
      ctx.beginPath();
      ctx.moveTo(325, 50);
      ctx.lineTo(325, 525);
      ctx.strokeStyle = '#a020f0';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Guia Superior Arredondada
      ctx.beginPath();
      ctx.moveTo(325, 50);
      ctx.quadraticCurveTo(325, 15, 180, 15);
      ctx.quadraticCurveTo(20, 15, 20, 120);
      ctx.strokeStyle = '#00d8ff';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Guias diagonais inferiores
      ctx.beginPath();
      ctx.moveTo(20, 380); ctx.lineTo(115, 465);
      ctx.moveTo(360, 380); ctx.lineTo(265, 465);
      ctx.strokeStyle = '#0077ff';
      ctx.lineWidth = 5;
      ctx.stroke();

      // Desenhar Pinos
      pins.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#00f0ff';
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Desenhar Bumpers
      bumpers.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.hitTime > 0 ? '#ffff00' : '#ff3300';
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 4;
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('★', b.x, b.y);
      });

      // Desenhar Flippers
      drawFlipper(flipperLeft);
      drawFlipper(flipperRight);

      // Desenhar Mola de Compressão no Canal Direito
      drawCompressionSpring();

      // Desenhar Bola
      if (ball.active) {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#e6e6e6';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#aaaaaa';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Game Over
      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#ff0055';
        ctx.font = '22px Arial Black';
        ctx.textAlign = 'center';
        ctx.fillText('FIM DE JOGO', canvas.width / 2, 230);

        ctx.fillStyle = '#ffffff';
        ctx.font = '13px Arial';
        ctx.fillText('Toque em REINICIAR para tentar de novo', canvas.width / 2, 270);
      }
    }

    function drawFlipper(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.angle);
      
      ctx.beginPath();
      ctx.roundRect(0, -6, f.length, 12, 6);
      ctx.fillStyle = '#ffaa00';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.restore();
    }

    // Função que desenha a mola comprimindo de baixo para cima
    function drawCompressionSpring() {
      let bottomBaseY = launcher.restY; // Base fixa embaixo (520)
      let currentTopY = ball.inChute ? (ball.y + ball.radius) : 490; // O topo empurra a bola
      let compressedHeight = bottomBaseY - currentTopY;
      
      let coils = 6;
      let step = compressedHeight / coils;

      ctx.beginPath();
      ctx.moveTo(launcher.x, bottomBaseY);

      if (compressedHeight > 10) {
        for (let i = 0; i < coils; i++) {
          let currentY = bottomBaseY - (i * step);
          let xOffset = (i % 2 === 0) ? 10 : -10;
          ctx.lineTo(launcher.x + xOffset, currentY - step / 2);
          ctx.lineTo(launcher.x, currentY - step);
        }
      }

      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 3;
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#00ffff';
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Base do pistão do lançador
      ctx.fillStyle = '#ff0055';
      ctx.fillRect(launcher.x - 12, bottomBaseY, 24, 6);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
