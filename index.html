<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Super Pinball Arcade</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #07112e;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 8px;
    overflow-x: hidden;
}

h1 {
    color: #ffe45e;
    font-size: clamp(22px, 6vw, 34px);
    margin: 6px 0 10px;
    text-shadow: 2px 3px #a84b00;
}

.info {
    display: flex;
    justify-content: space-around;
    gap: 4px;
    background: #101e4d;
    border: 2px solid #08dfff;
    border-radius: 10px;
    padding: 10px 2px;
    margin-bottom: 8px;
    font-size: clamp(13px, 3.5vw, 19px);
    font-weight: bold;
}

.info span {
    color: #00eaff;
}

canvas {
    display: block;
    width: min(98vw, 440px);
    height: auto;
    max-height: 66dvh;
    margin: 0 auto;
    background: #061747;
    border: 4px solid #08cfff;
    border-radius: 14px;
    touch-action: none;
}

.controls {
    width: min(98vw, 440px);
    margin: 10px auto 0;
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    gap: 7px;
}

button {
    border: 2px solid #ffffff;
    border-radius: 12px;
    padding: 13px 3px;
    font-size: clamp(13px, 3.7vw, 17px);
    font-weight: bold;
    color: #07112e;
    background: #ffda35;
    box-shadow: 0 4px 0 #a46c00;
    cursor: pointer;
    touch-action: manipulation;
}

button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #a46c00;
}

#launchBtn {
    background: #00eaff;
    box-shadow: 0 4px 0 #007a9b;
}

#restartBtn {
    background: #ff496b;
    box-shadow: 0 4px 0 #8e173b;
}

#updateBtn {
    display: block;
    margin: 10px auto;
    background: #c58bff;
    box-shadow: 0 4px 0 #61349c;
    padding: 10px 20px;
}

p {
    font-size: 12px;
    color: #a9eaff;
    margin: 10px auto;
    max-width: 440px;
    line-height: 1.5;
}
</style>

</head>

<body>

<h1>⭐ SUPER PINBALL ⭐</h1>

<div class="info">
    <div>Pontos: <span id="score">0</span></div>
    <div>Recorde: <span id="record">0</span></div>
    <div>Bolas: <span id="balls">3</span></div>
</div>

<canvas id="game" width="400" height="700"></canvas>

<div class="controls">
    <button id="leftBtn">◀ ESQ.</button>
    <button id="launchBtn">LANÇAR</button>
    <button id="rightBtn">DIR. ▶</button>
</div>

<button id="restartBtn">🔄 REINICIAR</button> <button id="updateBtn">⟳ ATUALIZAR JOGO</button>

<p>
    Segure ESQ. e DIR. para rebater a bola.
    Toque em LANÇAR para lançar a bola pelo corredor.
</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const recordEl = document.getElementById("record");
const ballsEl = document.getElementById("balls");

const W = canvas.width;
const H = canvas.height;

// Corredor de lançamento no lado direito.
const LANE_LEFT = 344;
const LANE_RIGHT = 384;

// A parede esquerda do corredor termina antes do topo.
// Assim, a bola pode sair do corredor e entrar no jogo.
const LANE_WALL_TOP = 112;
const LANE_WALL_BOTTOM = 642;

const GRAVITY = 0.105;
const MAX_SPEED = 9.5;

let score = 0;
let balls = 3;
let gameOver = false;
let launched = false;
let launching = false;
let launchStage = "ready";
let leftPressed = false;
let rightPressed = false;
let lastTime = 0;
let animationId = null;

let record = 0;

try {
    record = Number(localStorage.getItem("pinballRecord") || 0);
} catch (e) {
    record = 0;
}

recordEl.textContent = record;

const ball = {
    x: 364,
    y: 610,
    r: 8,
    vx: 0,
    vy: 0,
    active: true
};

const bumpers = [
    {x: 100, y: 145, r: 24},
    {x: 235, y: 185, r: 25},
    {x: 170, y: 270, r: 24},
    {x: 75, y: 340, r: 20},
    {x: 265, y: 340, r: 20}
];

const pegs = [
    {x: 155, y: 85, r: 5},
    {x: 250, y: 95, r: 5},
    {x: 70, y: 205, r: 5},
    {x: 145, y: 205, r: 5},
    {x: 305, y: 220, r: 5},
    {x: 50, y: 270, r: 5},
    {x: 115, y: 295, r: 5},
    {x: 220, y: 290, r: 5},
    {x: 305, y: 285, r: 5},
    {x: 120, y: 385, r: 5},
    {x: 200, y: 400, r: 5},
    {x: 300, y: 405, r: 5},
    {x: 80, y: 445, r: 5},
    {x: 155, y: 470, r: 5},
    {x: 240, y: 460, r: 5},
    {x: 300, y: 500, r: 5}
];

const flippers = {
    left: {x: 105, y: 590, length: 75, angle: 0.25},
    right: {x: 285, y: 590, length: 75, angle: Math.PI - 0.25}
};

function updateInfo() {
    scoreEl.textContent = score;
    recordEl.textContent = record;
    ballsEl.textContent = balls;
}

function addScore(points) {
    score += points;

    if (score > record) {
        record = score;
        try {
            localStorage.setItem("pinballRecord", String(record));
        } catch (e) {}
    }

    updateInfo();
}

function resetBall() {
    ball.x = 364;
    ball.y = 610;
    ball.vx = 0;
    ball.vy = 0;
    ball.active = true;

    launched = false;
    launching = false;
    launchStage = "ready";
}

function restartGame() {
    score = 0;
    balls = 3;
    gameOver = false;
    leftPressed = false;
    rightPressed = false;

    resetBall();
    updateInfo();
}

function launchBall() {
    if (gameOver || launched || launching) return;

    launched = true;
    launching = true;
    launchStage = "lane";

    ball.x = 364;
    ball.y = 610;

    // Lançamento vertical pelo corredor.
    ball.vx = 0;
    ball.vy = -7.2;
}

function clampBallSpeed() {
    ball.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, ball.vx));
    ball.vy = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, ball.vy));
}

function collideWithCircle(obj, radius, bounce, points) {
    const dx = ball.x - obj.x;
    const dy = ball.y - obj.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const minDist = ball.r + radius;

    if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const ny = dy / dist;

        ball.x = obj.x + nx * (minDist + 0.5);
        ball.y = obj.y + ny * (minDist + 0.5);

        const dot = ball.vx * nx + ball.vy * ny;

        if (dot < 0) {
            ball.vx -= (1 + bounce) * dot * nx;
            ball.vy -= (1 + bounce) * dot * ny;
        }

        if (points) addScore(points);
    }
}

function collideWithSegment(x1, y1, x2, y2, thickness, bounce) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len2 = dx * dx + dy * dy;

    if (len2 === 0) return;

    let t = ((ball.x - x1) * dx + (ball.y - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));

    const px = x1 + t * dx;
    const py = y1 + t * dy;

    const nx0 = ball.x - px;
    const ny0 = ball.y - py;
    const dist = Math.sqrt(nx0 * nx0 + ny0 * ny0);
    const minDist = ball.r + thickness;

    if (dist < minDist && dist > 0) {
        const nx = nx0 / dist;
        const ny = ny0 / dist;

        ball.x = px + nx * (minDist + 0.5);
        ball.y = py + ny * (minDist + 0.5);

        const dot = ball.vx * nx + ball.vy * ny;

        if (dot < 0) {
            ball.vx -= (1 + bounce) * dot * nx;
            ball.vy -= (1 + bounce) * dot * ny;
        }
    }
}

function collideWithFlipper(f, side) {
    let angle;

    if (side === "left") {
        angle = leftPressed ? -0.55 : 0.25;
    } else {
        angle = rightPressed ? Math.PI + 0.55 : Math.PI - 0.25;
    }

    const x2 = f.x + Math.cos(angle) * f.length;
    const y2 = f.y + Math.sin(angle) * f.length;

    collideWithSegment(f.x, f.y, x2, y2, 7, 1.15);
}

function updatePhysics(dt) {
    if (!ball.active || gameOver) return;

    const steps = Math.max(1, Math.ceil(dt / 2));
    const step = dt / steps;

    for (let s = 0; s < steps; s++) {
        // Durante o lançamento, a bola segue livre pelo corredor.
        if (launching && launchStage === "lane") {
            ball.x = 364;
            ball.vx = 0;

            // Quando chega à abertura superior, vira para a esquerda.
            if (ball.y <= LANE_WALL_TOP - ball.r) {
                launchStage = "entering";
                ball.vx = -3.0;
                ball.vy = -2.0;
            }
        }

        ball.vy += GRAVITY * step;

        ball.x += ball.vx * step;
        ball.y += ball.vy * step;

        // Limite superior: não deixa a bola sair da tela.
        if (ball.y < 12 + ball.r) {
            ball.y = 12 + ball.r;
            ball.vy = Math.abs(ball.vy) * 0.75;
        }

        // Parede esquerda.
        if (ball.x < 12 + ball.r) {
            ball.x = 12 + ball.r;
            ball.vx = Math.abs(ball.vx) * 0.8;
        }

        // Parede direita exterior.
        if (ball.x > 388 - ball.r) {
            ball.x = 388 - ball.r;
            ball.vx = -Math.abs(ball.vx) * 0.8;
        }

        // Parede que separa o corredor do jogo.
        // IMPORTANTE: ela só existe abaixo de y=112.
        // Não há parede na abertura superior por onde a bola entra.
        if (
            ball.y + ball.r > LANE_WALL_TOP &&
            ball.y - ball.r < LANE_WALL_BOTTOM &&
            ball.x + ball.r > LANE_LEFT - 3 &&
            ball.x < LANE_LEFT &&
            !(launching && launchStage === "lane")
        ) {
            ball.x = LANE_LEFT - ball.r - 3;
            ball.vx = -Math.abs(ball.vx) * 0.75;
        }

        // Parede direita do corredor, com passagem livre para cima.
        if (
            ball.y > LANE_WALL_TOP &&
            ball.y < LANE_WALL_BOTTOM &&
            ball.x + ball.r > LANE_RIGHT
        ) {
            ball.x = LANE_RIGHT - ball.r;
            ball.vx = -Math.abs(ball.vx) * 0.7;
        }

        // Obstáculos dentro da área principal.
        if (!launching || launchStage !== "lane") {
            for (const b of bumpers) {
                collideWithCircle(b, b.r, 1.25, 10);
            }

            for (const p of pegs) {
                collideWithCircle(p, p.r, 0.9, 1);
            }

            collideWithSegment(20, 115, 20, 540, 5, 0.8);
            collideWithSegment(20, 540, 65, 580, 5, 0.8);

            collideWithFlipper(flippers.left, "left");
            collideWithFlipper(flippers.right, "right");
        }

        clampBallSpeed();

        // A bola caiu: desconta uma vida e permite lançar novamente.
        if (ball.y > H + 20) {
            balls--;
            updateInfo();

            if (balls <= 0) {
                gameOver = true;
                ball.active = false;
            } else {
                resetBall();
            }
            return;
        }

        // Quando cruza a abertura, termina o lançamento e entra no jogo.
        if (
            launching &&
            launchStage === "entering" &&
            ball.x < LANE_LEFT - ball.r - 2
        ) {
            launching = false;
            launchStage = "playing";
            ball.vx = -2.5;
            ball.vy = 1.0;
        }
    }
}

function drawCircle(x, y, r, color, glow) {
    ctx.save();
    ctx.shadowBlur = glow || 0;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawFlipper(f, side) {
    const angle = side === "left"
        ? (leftPressed ? -0.55 : 0.25)
        : (rightPressed ? Math.PI + 0.55 : Math.PI - 0.25);

    const x2 = f.x + Math.cos(angle) * f.length;
    const y2 = f.y + Math.sin(angle) * f.length;

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineWidth = 17;
    ctx.strokeStyle = "#ff8a00";
    ctx.shadowBlur = 12;
    ctx.shadowColor = "#ffb300";

    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.lineWidth = 11;
    ctx.strokeStyle = "#ffe83a";
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    drawCircle(f.x, f.y, 7, "#f4ffff", 5);
    ctx.restore();
}

function drawGame() {
    ctx.clearRect(0, 0, W, H);

    // Fundo da mesa.
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#0b286f");
    bg.addColorStop(0.55, "#071747");
    bg.addColorStop(1, "#03102f");

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Borda externa.
    ctx.strokeStyle = "#00dfff";
    ctx.lineWidth = 5;
    ctx.strokeRect(8, 8, 384, 684);

    // Área de jogo à esquerda.
    ctx.fillStyle = "#07153f";
    ctx.fillRect(17, 18, LANE_LEFT - 18, 660);

    // Corredor de lançamento à direita.
    ctx.fillStyle = "#101d56";
    ctx.fillRect(LANE_LEFT, 18, LANE_RIGHT - LANE_LEFT, 660);

    // Trilhos do corredor.
    ctx.strokeStyle = "#c16bff";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(LANE_LEFT, LANE_WALL_TOP);
    ctx.lineTo(LANE_LEFT, LANE_WALL_BOTTOM);
    ctx.stroke();

    ctx.strokeStyle = "#8e51ff";
    ctx.beginPath();
    ctx.moveTo(LANE_RIGHT, 18);
    ctx.lineTo(LANE_RIGHT, 678);
    ctx.stroke();

    // Setas luminosas mostrando o caminho até a abertura.
    ctx.fillStyle = "#00eaff";
    ctx.beginPath();
    ctx.moveTo(364, 35);
    ctx.lineTo(353, 53);
    ctx.lineTo(364, 48);
    ctx.lineTo(375, 53);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#8bdfff";
    ctx.font = "bold 15px Arial";
    ctx.textAlign = "center";
    ctx.fillText("↑", 364, 83);

    // Pinos.
    for (const p of pegs) {
        drawCircle(p.x, p.y, p.r + 2, "#0077ff", 5);
        drawCircle(p.x, p.y, p.r, "#e5faff", 3);
        drawCircle(p.x - 1, p.y - 1, 2, "#ffffff", 2);
    }

    // Bumpers.
    for (const b of bumpers) {
        drawCircle(b.x, b.y, b.r + 6, "#005cff", 10);
        drawCircle(b.x, b.y, b.r, "#ff5b00", 12);

        ctx.strokeStyle = "#ffdf5c";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r - 5, 0, Math.PI * 2);
        ctx.stroke();

        drawCircle(b.x, b.y, b.r - 9, "#ffb300", 5);

        ctx.fillStyle = "#fff6a6";
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("★", b.x, b.y + 1);
    }

    // Trilhos inclinados laterais, longe do corredor.
    ctx.strokeStyle = "#078fff";
    ctx.lineWidth = 7;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(20, 180);
    ctx.lineTo(48, 235);
    ctx.lineTo(22, 280);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(310, 180);
    ctx.lineTo(326, 235);
    ctx.lineTo(310, 280);
    ctx.stroke();

    // Guias inferiores.
    ctx.strokeStyle = "#187aff";
    ctx.lineWidth = 7;

    ctx.beginPath();
    ctx.moveTo(20, 500);
    ctx.lineTo(65, 550);
    ctx.lineTo(90, 585);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(310, 500);
    ctx.lineTo(300, 550);
    ctx.lineTo(285, 585);
    ctx.stroke();

    // Flippers.
    drawFlipper(flippers.left, "left");
    drawFlipper(flippers.right, "right");

    // Compartimento inferior da bola no corredor.
    ctx.fillStyle = "#030b26";
    ctx.fillRect(347, 620, 34, 55);

    ctx.strokeStyle = "#a66aff";
    ctx.lineWidth = 3;
    ctx.strokeRect(347, 620, 34, 55);

    // Bola.
    if (ball.active) {
        drawCircle(ball.x, ball.y, ball.r + 3, "#00aaff", 10);
        drawCircle(ball.x, ball.y, ball.r, "#f2ffff", 5);
        drawCircle(ball.x - 2, ball.y - 2, 3, "#ffffff", 3);
    }

    // Mensagens.
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(35, 270, 300, 100);

        ctx.fillStyle = "#ff526f";
        ctx.font = "bold 28px Arial";
        ctx.fillText("FIM DE JOGO", 185, 305);

        ctx.fillStyle = "#ffffff";
        ctx.font = "16px Arial";
        ctx.fillText("Toque em REINICIAR", 185, 340);
    } else if (!launched) {
        ctx.fillStyle = "#c5faff";
        ctx.font = "bold 12px Arial";
        ctx.fillText("TOQUE EM LANÇAR", 364, 575);
    }
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;

    let dt = (timestamp - lastTime) / 16.667;
    lastTime = timestamp;

    dt = Math.min(dt, 2);

    if (!gameOver) {
        updatePhysics(dt);
    }

    drawGame();
    animationId = requestAnimationFrame(gameLoop);
}

document.getElementById("launchBtn").addEventListener("click", launchBall);
document.getElementById("restartBtn").addEventListener("click", restartGame);

document.getElementById("updateBtn").addEventListener("click", function() {
    const url = new URL(window.location.href);
    url.searchParams.set("atualizar", Date.now());
    window.location.replace(url.toString());
});

function setButtonHold(buttonId, side) {
    const btn = document.getElementById(buttonId);

    const press = function(e) {
        e.preventDefault();
        if (side === "left") leftPressed = true;
        else rightPressed = true;
    };

    const release = function(e) {
        e.preventDefault();
        if (side === "left") leftPressed = false;
        else rightPressed = false;
    };

    btn.addEventListener("pointerdown", press);
    btn.addEventListener("pointerup", release);
    btn.addEventListener("pointerleave", release);
    btn.addEventListener("pointercancel", release);
}

setButtonHold("leftBtn", "left");
setButtonHold("rightBtn", "right");

document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        leftPressed = true;
        e.preventDefault();
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        rightPressed = true;
        e.preventDefault();
    }

    if (e.key === " " || e.key === "Enter") {
        launchBall();
        e.preventDefault();
    }
});

document.addEventListener("keyup", function(e) {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        leftPressed = false;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        rightPressed = false;
    }
});

updateInfo();
resetBall();
drawGame();

if (animationId !== null) {
    cancelAnimationFrame(animationId);
}

animationId = requestAnimationFrame(gameLoop);
</script>

</body>
</html>
