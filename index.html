<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Pinball Arcade</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

body {
    margin: 0;
    padding: 10px;
    background: #030814;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: white;
}

#game-container {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, #091227, #050a18);
    border: 4px solid #00d8ff;
    border-radius: 16px;
    box-shadow: 0 0 20px #00aaff66;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.title {
    font-size: 19px;
    color: #ffea00;
    text-shadow: 0 0 8px #ffaa00;
    margin-bottom: 8px;
    text-align: center;
}

.scoreboard {
    width: 100%;
    display: flex;
    justify-content: space-between;
    background: #020712;
    border: 2px solid #00aaff;
    border-radius: 8px;
    padding: 7px;
    margin-bottom: 10px;
    font-size: 12px;
}

.score-item span {
    color: #00f0ff;
    font-size: 15px;
}

canvas {
    width: 100%;
    max-width: 380px;
    height: auto;
    display: block;
    background: #030a1c;
    border: 3px solid #1a3968;
    border-radius: 12px;
}

.controls {
    width: 100%;
    margin-top: 12px;
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    gap: 8px;
}

.btn {
    border: 2px solid white;
    border-radius: 18px;
    padding: 12px 4px;
    font-size: 13px;
    font-weight: bold;
    color: black;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 #000;
    touch-action: none;
}

.btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #000;
}

.btn-yellow {
    background: linear-gradient(#fff066, #ffcc00);
}

.btn-launch {
    background: linear-gradient(#66ffff, #00ccff);
    font-size: 15px;
}

.btn-reset {
    background: linear-gradient(#ff6699, #ff0055);
    color: white;
    grid-column: span 3;
    padding: 9px;
    font-size: 12px;
}

.btn-update {
    background: linear-gradient(#cc66ff, #9900ff);
    color: white;
    grid-column: span 3;
    padding: 9px;
    font-size: 12px;
}

.instructions {
    font-size: 10px;
    color: #8ab4f8;
    margin-top: 10px;
    text-align: center;
}
</style>
</head>

<body>

<div id="game-container">

    <div class="title">★ SUPER PINBALL ARCADE ★</div>

    <div class="scoreboard">
        <div class="score-item">Pontos: <span id="score">0</span></div>
        <div class="score-item">Recorde: <span id="highscore">0</span></div>
        <div class="score-item">Bolas: <span id="balls">3</span></div>
    </div>

    <canvas id="canvas" width="380" height="540"></canvas>

    <div class="controls">
        <button class="btn btn-yellow" id="btn-left">◄ ESQ.</button>
        <button class="btn btn-launch" id="btn-launch">LANÇAR</button>
        <button class="btn btn-yellow" id="btn-right">DIR. ►</button>
        <button class="btn btn-reset" id="btn-reset">🔄 REINICIAR JOGO</button>
        <button class="btn btn-update" id="btn-update">⟳ ATUALIZAR JOGO</button>
    </div>

    <div class="instructions">
        Segure ESQ. e DIR. para rebater. Segure LANÇAR para comprimir a mola e solte para disparar!
    </div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const highscoreEl = document.getElementById("highscore");
const ballsEl = document.getElementById("balls");

let score = 0;
let highscore = Number(localStorage.getItem("pinballRecord") || 0);
let balls = 3;
let gameOver = false;

highscoreEl.textContent = highscore;

// Corredor de lançamento
const launcher = {
    x: 350,
    baseY: 510,
    compress: 0,
    maxCompress: 45
};

// Bola
const ball = {
    x: 350,
    y: 470,
    vx: 0,
    vy: 0,
    radius: 9,
    inChute: true,
    active: true
};

// Palhetas mais próximas
const flipperLeft = {
    x: 130,
    y: 475,
    length: 52,
    angle: 0.12,
    restAngle: 0.12,
    targetAngle: 0.12,
    upAngle: -0.65,
    speed: 0.35
};

const flipperRight = {
    x: 250,
    y: 475,
    length: 52,
    angle: Math.PI - 0.12,
    restAngle: Math.PI - 0.12,
    targetAngle: Math.PI - 0.12,
    upAngle: Math.PI + 0.65,
    speed: 0.35
};

// Alvos que aumentam a pontuação
const bumpers = [
    {x:130, y:130, radius:22, hitTime:0},
    {x:210, y:150, radius:22, hitTime:0},
    {x:170, y:220, radius:22, hitTime:0},
    {x:110, y:270, radius:18, hitTime:0},
    {x:230, y:270, radius:18, hitTime:0}
];

// Pinos
const pins = [];

const pinRows = [
    {count:5, y:90, minX:100, maxX:240},
    {count:6, y:180, minX:80, maxX:260},
    {count:7, y:300, minX:70, maxX:270},
    {count:8, y:360, minX:60, maxX:280}
];

pinRows.forEach(row => {
    const step = (row.maxX-row.minX)/(row.count-1);

    for(let i=0; i<row.count; i++) {
        pins.push({
            x:row.minX+i*step,
            y:row.y,
            radius:4
        });
    }
});

const keys = {
    left:false,
    right:false,
    launch:false
};

// Teclado
window.addEventListener("keydown", e => {
    if(["ArrowLeft","ArrowRight","ArrowDown"," "].includes(e.key)) {
        e.preventDefault();
    }

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
        keys.left=true;

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
        keys.right=true;

    if(e.key===" " || e.key==="ArrowDown")
        keys.launch=true;
});

window.addEventListener("keyup", e => {
    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
        keys.left=false;

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
        keys.right=false;

    if(e.key===" " || e.key==="ArrowDown") {
        if(keys.launch) {
            keys.launch=false;
            releaseLauncher();
        }
    }
});

// Botões compatíveis com celular e computador
function setupButton(id, onStart, onEnd) {
    const btn = document.getElementById(id);

    btn.addEventListener("pointerdown", e => {
        e.preventDefault();
        btn.setPointerCapture(e.pointerId);
        onStart();
    });

    function finish(e) {
        e.preventDefault();
        onEnd();
    }

    btn.addEventListener("pointerup", finish);
    btn.addEventListener("pointercancel", finish);
    btn.addEventListener("lostpointercapture", onEnd);
}

setupButton(
    "btn-left",
    () => keys.left=true,
    () => keys.left=false
);

setupButton(
    "btn-right",
    () => keys.right=true,
    () => keys.right=false
);

setupButton(
    "btn-launch",
    () => keys.launch=true,
    () => {
        if(keys.launch) {
            keys.launch=false;
            releaseLauncher();
        }
    }
);

document.getElementById("btn-reset").addEventListener("click", resetGame);

document.getElementById("btn-update").addEventListener("click", () => {
    location.reload();
});

// Lançamento com a mola
function releaseLauncher() {
    if(ball.inChute && launcher.compress > 0) {
        const power = 12 + launcher.compress * 0.55;

        ball.vy = -Math.min(power, 34);
        ball.vx = -2.5;

        ball.inChute = false;
    }

    launcher.compress = 0;
}

// Reiniciar jogo
function resetGame() {
    score = 0;
    balls = 3;
    gameOver = false;

    scoreEl.textContent = score;
    ballsEl.textContent = balls;

    resetBall();
}

// Preparar nova bola
function resetBall() {
    ball.x = 350;
    ball.y = 470;
    ball.vx = 0;
    ball.vy = 0;
    ball.inChute = true;
    ball.active = true;

    launcher.compress = 0;
    keys.launch = false;

    flipperLeft.angle = flipperLeft.restAngle;
    flipperRight.angle = flipperRight.restAngle;
}

// Pontuação
function addScore(points) {
    score += points;
    scoreEl.textContent = score;

    if(score > highscore) {
        highscore = score;
        highscoreEl.textContent = highscore;
        localStorage.setItem("pinballRecord", highscore);
    }
}

// Colisão com uma linha
function checkLineCollision(x1,y1,x2,y2) {
    if(ball.inChute) return;

    const dx=x2-x1;
    const dy=y2-y1;
    const len= Math.hypot(dx,dy);

    const u=Math.max(0,Math.min(1,
        ((ball.x-x1)*dx+(ball.y-y1)*dy)/(len*len)
    ));

    const px=x1+u*dx;
    const py=y1+u*dy;

    const diffX=ball.x-px;
    const diffY=ball.y-py;
    const dist=Math.hypot(diffX,diffY);

    if(dist < ball.radius+3) {
        const nx=dist>0 ? diffX/dist : 0;
        const ny=dist>0 ? diffY/dist : -1;

        const dot=ball.vx*nx+ball.vy*ny;

        if(dot<0) {
            ball.vx-=1.7*dot*nx;
            ball.vy-=1.7*dot*ny;
        }

        ball.x=px+nx*(ball.radius+3);
        ball.y=py+ny*(ball.radius+3);
    }
}

// Colisão com as palhetas
function checkFlipperCollision(f,isLeft) {
    if(ball.inChute) return;

    const x2=f.x+Math.cos(f.angle)*f.length;
    const y2=f.y+Math.sin(f.angle)*f.length;

    const dx=x2-f.x;
    const dy=y2-f.y;
    const len2=dx*dx+dy*dy;

    const u=Math.max(0,Math.min(1,
        ((ball.x-f.x)*dx+(ball.y-f.y)*dy)/len2
    ));

    const px=f.x+u*dx;
    const py=f.y+u*dy;

    const diffX=ball.x-px;
    const diffY=ball.y-py;
    const dist=Math.hypot(diffX,diffY);

    if(dist < ball.radius+7) {
        let nx,ny;

        if(dist>0) {
            nx=diffX/dist;
            ny=diffY/dist;
        } else {
            nx=0;
            ny=-1;
        }

        const moving = isLeft
            ? keys.left
            : keys.right;

        const impulse = moving ? 15 : 7;

        ball.vx=nx*impulse;
        ball.vy=Math.min(ny*impulse-3,-5);

        ball.x=px+nx*(ball.radius+8);
        ball.y=py+ny*(ball.radius+8);
    }
}

// Física do jogo
function update() {
    if(gameOver) return;

    // Mola desce quando o botão é segurado
    if(keys.launch && ball.inChute) {
        launcher.compress=Math.min(
            launcher.compress+1.5,
            launcher.maxCompress
        );

        ball.y=470+launcher.compress*0.35;
    }

    // Movimento das palhetas
    flipperLeft.targetAngle=keys.left
        ? flipperLeft.upAngle
        : flipperLeft.restAngle;

    flipperRight.targetAngle=keys.right
        ? flipperRight.upAngle
        : flipperRight.restAngle;

    flipperLeft.angle +=
        (flipperLeft.targetAngle-flipperLeft.angle)
        * flipperLeft.speed;

    flipperRight.angle +=
        (flipperRight.targetAngle-flipperRight.angle)
        * flipperRight.speed;

    // Movimento da bola
    if(!ball.inChute) {
        ball.vy+=0.20;

        ball.x+=ball.vx;
        ball.y+=ball.vy;

        ball.vx*=0.998;
        ball.vy*=0.998;

        // Limitar velocidades
        ball.vx=Math.max(-18,Math.min(18,ball.vx));
        ball.vy=Math.max(-24,Math.min(24,ball.vy));
    }

    // Parede esquerda
    if(ball.x-ball.radius<20) {
        ball.x=20+ball.radius;
        ball.vx=Math.abs(ball.vx)*0.8;
    }

    // Teto
    if(ball.y-ball.radius<20) {
        ball.y=20+ball.radius;
        ball.vy=Math.abs(ball.vy)*0.8;
    }

    // Corredor de lançamento à direita.
    // A bola sobe pelo corredor e sai para a esquerda no topo.
    if(!ball.inChute && ball.x>325 && ball.y>45 && ball.y<510) {
        ball.x=325-ball.radius;
        ball.vx=-Math.max(4,Math.abs(ball.vx));
    }

    // Paredes laterais do corredor
    if(!ball.inChute && ball.x>325 && ball.y>=510) {
        ball.x=325-ball.radius;
        ball.vx=-Math.abs(ball.vx);
    }

    // Guias inferiores
    checkLineCollision(20,390,130,475);
    checkLineCollision(320,390,250,475);

    // Bumpers
    bumpers.forEach(b => {
        const dx=ball.x-b.x;
        const dy=ball.y-b.y;
        const dist=Math.hypot(dx,dy);

        if(!ball.inChute && dist<ball.radius+b.radius) {
            const angle=Math.atan2(dy,dx);
            const power=10;

            ball.vx=Math.cos(angle)*power;
            ball.vy=Math.sin(angle)*power;

            // Afastar a bola para evitar pontuação repetida
            ball.x=b.x+Math.cos(angle)*(ball.radius+b.radius+1);
            ball.y=b.y+Math.sin(angle)*(ball.radius+b.radius+1);

            b.hitTime=12;
            addScore(100);
        }

        if(b.hitTime>0) b.hitTime--;
    });

    // Pinos
    pins.forEach(p => {
        const dx=ball.x-p.x;
        const dy=ball.y-p.y;
        const dist=Math.hypot(dx,dy);

        if(!ball.inChute && dist<ball.radius+p.radius) {
            const angle=Math.atan2(dy,dx);

            ball.vx=Math.cos(angle)*5;
            ball.vy=Math.sin(angle)*5;

            ball.x=p.x+Math.cos(angle)*(ball.radius+p.radius+1);
            ball.y=p.y+Math.sin(angle)*(ball.radius+p.radius+1);

            addScore(10);
        }
    });

    // Palhetas
    checkFlipperCollision(flipperLeft,true);
    checkFlipperCollision(flipperRight,false);

    // Perdeu a bola
    if(ball.y>535) {
        balls--;
        ballsEl.textContent=balls;

        if(balls<=0) {
            gameOver=true;
        } else {
            resetBall();
        }
    }
}

// Desenhar palheta
function drawFlipper(f) {
    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(f.angle);

    ctx.beginPath();
    ctx.roundRect(0,-6,f.length,12,6);

    ctx.fillStyle="#ffaa00";
    ctx.fill();

    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.restore();
}

// Desenhar mola
function drawCompressionSpring() {
    const bottomY=launcher.baseY;
    const topY=ball.inChute
        ? ball.y+ball.radius+2
        : 500;

    const height=Math.max(5,bottomY-topY);
    const coils=8;
    const step=height/coils;

    ctx.beginPath();
    ctx.moveTo(launcher.x,bottomY);

    for(let i=1;i<=coils;i++) {
        const y=bottomY-step*i;
        const offset=(i%2===0)?-8:8;

        ctx.lineTo(launcher.x+offset,y+step/2);
        ctx.lineTo(launcher.x,y);
    }

    ctx.strokeStyle="#00ffff";
    ctx.lineWidth=3;
    ctx.shadowBlur=6;
    ctx.shadowColor="#00ffff";
    ctx.stroke();
    ctx.shadowBlur=0;

    ctx.fillStyle="#ff0055";
    ctx.fillRect(launcher.x-12,bottomY,24,6);
}

// Desenhar jogo
function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Bordas
    ctx.strokeStyle="#00aaff";
    ctx.lineWidth=3;
    ctx.strokeRect(10,10,360,520);

    // Corredor lateral direito
    ctx.beginPath();
    ctx.moveTo(325,40);
    ctx.lineTo(325,525);
    ctx.strokeStyle="#00d8ff";
    ctx.lineWidth=3;
    ctx.stroke();

    // Guia superior
    ctx.beginPath();
    ctx.moveTo(325,40);
    ctx.quadraticCurveTo(325,15,180,15);
    ctx.quadraticCurveTo(20,15,20,120);

    ctx.strokeStyle="#00d8ff";
    ctx.lineWidth=4;
    ctx.stroke();

    // Guias inferiores
    ctx.beginPath();
    ctx.moveTo(20,390);
    ctx.lineTo(130,475);

    ctx.moveTo(320,390);
    ctx.lineTo(250,475);

    ctx.strokeStyle="#0077ff";
    ctx.lineWidth=5;
    ctx.stroke();

    // Pinos
    pins.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);

        ctx.fillStyle="#ffffff";
        ctx.shadowBlur=4;
        ctx.shadowColor="#00f0ff";
        ctx.fill();
        ctx.shadowBlur=0;
    });

    // Bumpers
    bumpers.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);

        ctx.fillStyle=b.hitTime>0?"#ffff00":"#ff3300";
        ctx.strokeStyle="#ffcc00";
        ctx.lineWidth=4;
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle="#ffffff";
        ctx.font="16px sans-serif";
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        ctx.fillText("★",b.x,b.y);
    });

    // Palhetas
    drawFlipper(flipperLeft);
    drawFlipper(flipperRight);

    // Mola
    drawCompressionSpring();

    // Bola
    if(ball.active) {
        ctx.beginPath();
        ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);

        ctx.fillStyle="#e6e6e6";
        ctx.shadowBlur=8;
        ctx.shadowColor="#ffffff";
        ctx.fill();

        ctx.strokeStyle="#aaaaaa";
        ctx.lineWidth=1;
        ctx.stroke();
        ctx.shadowBlur=0;
    }

    // Indicador de compressão
    if(ball.inChute && keys.launch) {
        ctx.fillStyle="#00ffff";
        ctx.font="bold 12px Arial";
        ctx.textAlign="center";
        ctx.fillText(
            "FORÇA: "+Math.round(launcher.compress/launcher.maxCompress*100)+"%",
            270,430
        );
    }

    // Fim de jogo
    if(gameOver) {
        ctx.fillStyle="rgba(0,0,0,0.82)";
        ctx.fillRect(10,10,360,520);

        ctx.fillStyle="#ff0055";
        ctx.font="bold 24px Arial";
        ctx.textAlign="center";
        ctx.fillText("FIM DE JOGO",190,230);

        ctx.fillStyle="#ffffff";
        ctx.font="13px Arial";
        ctx.fillText("Toque em REINICIAR",190,270);
    }
}

// Loop principal
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
