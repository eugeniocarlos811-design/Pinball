<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Super Pinball Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: #030814;
      font-family: 'Arial Black', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }

    #game-container {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #091227 0%, #050a18 100%);
      border: 4px solid #00d8ff;
      border-radius: 16px;
      box-shadow: 0 0 20px #00aaff66, inset 0 0 15px #0055ff55;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      font-size: 20px;
      color: #ffea00;
      text-shadow: 0 0 8px #ffaa00, 2px 2px 0px #000;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-align: center;
    }

    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      background: #020712;
      border: 2px solid #00aaff;
      border-radius: 8px;
      padding: 6px 12px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .score-item span {
      color: #00f0ff;
      font-size: 15px;
    }

    canvas {
      background: #030a1c;
      border: 3px solid #1a3968;
      border-radius: 12px;
      box-shadow: inset 0 0 20px #000;
      width: 100%;
      max-width: 380px;
      height: auto;
      display: block;
    }

    .controls {
      width: 100%;
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 20px;
      padding: 12px 6px;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
      transition: transform 0.05s, filter 0.1s;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #000;
    }

    .btn-yellow {
      background: linear-gradient(180deg, #fff066 0%, #ffcc00 100%);
      border: 2px solid #fff;
    }
    .btn-launch {
      background: linear-gradient(180deg, #66ffff 0%, #00ccff 100%);
      border: 2px solid #fff;
      font-size: 15px;
    }
    .btn-reset {
      background: linear-gradient(180deg, #ff6699 0%, #ff0055 100%);
      border: 2px solid #fff;
      color: #fff;
      grid-column: span 3;
      margin-top: 4px;
      padding: 8px;
      font-size: 12px;
      border-radius: 12px;
    }

    .instructions {
      font-size: 10px;
      color: #8ab4f8;
      margin-top: 8px;
      text-align: center;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="title">★ SUPER PINBALL ARCADE ★</div>
    
    <div class="scoreboard">
      <div class="score-item">Pontos: <span id="score">0</span></div>
      <div class="score-item">Recorde: <span id="highscore">0</span></div>
      <div class="score-item">Bolas: <span id="balls">3</span></div>
    </div>

    <canvas id="canvas" width="380" height="540"></canvas>

    <div class="controls">
      <button class="btn btn-yellow" id="btn-left">◄ ESQ.</button>
      <button class="btn btn-launch" id="btn-launch">LANÇAR</button>
      <button class="btn btn-yellow" id="btn-right">DIR. ►</button>
      <button class="btn btn-reset" id="btn-reset">🔄 REINICIAR JOGO</button>
    </div>

    <div class="instructions">
      Segure ESQ. e DIR. para rebater (Teclas A/D ou Setas).<br>Segure LANÇAR (ou Espaço) para puxar a mola e solte para disparar!
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let highscore = 0;
    let balls = 3;
    let gameOver = false;

    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const ballsEl = document.getElementById('balls');

    // Configuração da Mola (Corredor Lateral Direito x = 350)
    const launcher = {
      x: 350,
      baseY: 500,     // Onde a mola fica presa embaixo
      pull: 0,        // Quanto foi puxada para baixo
      maxPull: 70,    // Força máxima aumentada
      isCharging: false
    };

    // Bola
    const ball = {
      x: 350,
      y: 480,
      vx: 0,
      vy: 0,
      radius: 9,
      inChute: true,
      active: true
    };

    // Flippers
    const flipperLeft = {
      x: 110, y: 465, length: 65, angle: 0.35, targetAngle: 0.35, restAngle: 0.35, upAngle: -0.35, speed: 0.3
    };
    const flipperRight = {
      x: 230, y: 465, length: 65, angle: Math.PI - 0.35, targetAngle: Math.PI - 0.35, restAngle: Math.PI - 0.35, upAngle: Math.PI + 0.35, speed: 0.3
    };

    // Bumpers
    const bumpers = [
      { x: 130, y: 130, radius: 22, hitTime: 0 },
      { x: 210, y: 150, radius: 22, hitTime: 0 },
      { x: 170, y: 220, radius: 22, hitTime: 0 },
      { x: 110, y: 270, radius: 18, hitTime: 0 },
      { x: 230, y: 270, radius: 18, hitTime: 0 }
    ];

    // Pinos fixos
    const pins = [];
    const pinRows = [
      { count: 5, y: 90, minX: 100, maxX: 240 },
      { count: 6, y: 180, minX: 80, maxX: 260 },
      { count: 7, y: 300, minX: 70, maxX: 270 },
      { count: 8, y: 360, minX: 60, maxX: 280 }
    ];

    pinRows.forEach(row => {
      let step = (row.maxX - row.minX) / (row.count - 1);
      for(let i=0; i<row.count; i++) {
        pins.push({ x: row.minX + i*step, y: row.y, radius: 4 });
      }
    });

    const keys = { left: false, right: false, launch: false };

    // Eventos de Teclado
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === ' ' || e.key === 'ArrowDown') {
        keys.launch = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      if (e.key === ' ' || e.key === 'ArrowDown') {
        if (keys.launch) {
          keys.launch = false;
          releaseLauncher();
        }
      }
    });

    // Controles Touch / Mouse
    function setupButton(id, onStart, onEnd) {
      const btn = document.getElementById(id);
      const start = (e) => { e.preventDefault(); onStart(); };
      const end = (e) => { e.preventDefault(); onEnd(); };

      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', end);
    }

    setupButton('btn-left', () => keys.left = true, () => keys.left = false);
    setupButton('btn-right', () => keys.right = true, () => keys.right = false);
    setupButton('btn-launch', () => keys.launch = true, () => {
      keys.launch = false;
      releaseLauncher();
    });

    document.getElementById('btn-reset').addEventListener('click', resetGame);

    function releaseLauncher() {
      if (ball.inChute && launcher.pull > 5) {
        // Força forte o suficiente para subir todo o corredor e entrar no campo
        ball.vy = -Math.min(launcher.pull * 0.32, 26);
        ball.vx = 0;
        ball.inChute = false;
      }
      launcher.pull = 0;
    }

    function resetGame() {
      score = 0;
      balls = 3;
      gameOver = false;
      scoreEl.innerText = score;
      ballsEl.innerText = balls;
      resetBall();
    }

    function resetBall() {
      ball.x = 350;
      ball.y = 480;
      ball.vx = 0;
      ball.vy = 0;
      ball.inChute = true;
      ball.active = true;
      launcher.pull = 0;
    }

    function update() {
      if (gameOver) return;

      // 1. Carregar mola
      if (keys.launch && ball.inChute) {
        if (launcher.pull < launcher.maxPull) {
          launcher.pull += 1.5;
        }
      }

      // 2. Movimento dos Flippers
      flipperLeft.targetAngle = keys.left ? flipperLeft.upAngle : flipperLeft.restAngle;
      flipperLeft.angle += (flipperLeft.targetAngle - flipperLeft.angle) * flipperLeft.speed;

      flipperRight.targetAngle = keys.right ? flipperRight.upAngle : flipperRight.restAngle;
      flipperRight.angle += (flipperRight.targetAngle - flipperRight.angle) * flipperRight.speed;

      // 3. Física da Bola
      if (!ball.inChute) {
        ball.vy += 0.28; // Gravidade
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Atrito
        ball.vx *= 0.992;
        ball.vy *= 0.992;
      } else {
        // Bola presa na ponta superior da mola
        ball.y = 480 - launcher.pull;
      }

      // 4. Paredes do Campo
      // Parede Esquerda
      if (ball.x - ball.radius < 15) { ball.x = 15 + ball.radius; ball.vx *= -0.7; }
      
      // Canaleta Direita (Separador em x = 325)
      if (ball.x > 325 && ball.y > 60 && ball.y < 510) {
        if (ball.inChute) {
          ball.x = 350; // Mantém no canal
        } else {
          // Se a bola vier do campo e cair no canal da direita, guia ela para baixo suavemente
          if (ball.x > 325 && ball.y < 420 && ball.vy > 0) {
            ball.x = 350;
          } else if (ball.x > 365) {
            ball.x = 365 - ball.radius;
            ball.vx *= -0.7;
          }
        }
      }

      // Topo do campo e curvatura de lançamento
      if (ball.y - ball.radius < 15) { 
        ball.y = 15 + ball.radius; 
        ball.vy *= -0.7; 
      }

      // Se a bola passou do topo do canal direito para dentro do campo principal
      if (!ball.inChute && ball.x > 310 && ball.y < 65) {
        ball.vx = -4 - Math.random() * 3; // Joga a bola para o campo principal à esquerda
      }

      // 5. Bumpers
      bumpers.forEach(b => {
        let dx = ball.x - b.x;
        let dy = ball.y - b.y;
        let dist = Math.hypot(dx, dy);
        if (dist < ball.radius + b.radius) {
          let angle = Math.atan2(dy, dx);
          let power = 11;
          ball.vx = Math.cos(angle) * power;
          ball.vy = Math.sin(angle) * power;
          b.hitTime = 12;
          score += 100;
          scoreEl.innerText = score;
          if (score > highscore) {
            highscore = score;
            highscoreEl.innerText = highscore;
          }
        }
        if (b.hitTime > 0) b.hitTime--;
      });

      // 6. Pinos
      pins.forEach(p => {
        let dx = ball.x - p.x;
        let dy = ball.y - p.y;
        let dist = Math.hypot(dx, dy);
        if (dist < ball.radius + p.radius) {
          let angle = Math.atan2(dy, dx);
          ball.vx = Math.cos(angle) * 5.5;
          ball.vy = Math.sin(angle) * 5.5;
          score += 10;
          scoreEl.innerText = score;
        }
      });

      // 7. Colisão Flippers
      checkFlipperCollision(flipperLeft, true);
      checkFlipperCollision(flipperRight, false);

      // 8. Perder Bola (Fundo)
      if (ball.y > 540) {
        balls--;
        ballsEl.innerText = balls;
        if (balls <= 0) {
          gameOver = true;
        } else {
          resetBall();
        }
      }
    }

    function checkFlipperCollision(f, isLeft) {
      let fx2 = f.x + Math.cos(f.angle) * f.length;
      let fy2 = f.y + Math.sin(f.angle) * f.length;
      let dx = fx2 - f.x;
      let dy = fy2 - f.y;
      let len = Math.hypot(dx, dy);
      let u = ((ball.x - f.x) * dx + (ball.y - f.y) * dy) / (len * len);

      if (u >= 0 && u <= 1) {
        let px = f.x + u * dx;
        let py = f.y + u * dy;
        let dist = Math.hypot(ball.x - px, ball.y - py);

        if (dist < ball.radius + 6) {
          let angle = Math.atan2(ball.y - py, ball.x - px);
          let impulse = (f.targetAngle !== f.restAngle) ? 15 : 7;
          ball.vx = Math.cos(angle) * impulse;
          ball.vy = Math.sin(angle) * impulse - 3;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Borda principal do pinball
      ctx.strokeStyle = '#00aaff';
      ctx.lineWidth = 3;
      ctx.strokeRect(10, 10, 360, 520);

      // Canaleta Lateral Direita
      ctx.beginPath();
      ctx.moveTo(325, 50);
      ctx.lineTo(325, 525);
      ctx.strokeStyle = '#a020f0';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Guia Superior Arredondada
      ctx.beginPath();
      ctx.moveTo(325, 50);
      ctx.quadraticCurveTo(325, 15, 180, 15);
      ctx.quadraticCurveTo(15, 15, 15, 120);
      ctx.strokeStyle = '#00d8ff';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Guias diagonais inferiores
      ctx.beginPath();
      ctx.moveTo(15, 380); ctx.lineTo(110, 465);
      ctx.moveTo(325, 380); ctx.lineTo(230, 465);
      ctx.strokeStyle = '#0077ff';
      ctx.lineWidth = 5;
      ctx.stroke();

      // Desenhar Pinos
      pins.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#00f0ff';
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Desenhar Bumpers
      bumpers.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.hitTime > 0 ? '#ffff00' : '#ff3300';
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 4;
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('★', b.x, b.y);
      });

      // Desenhar Flippers
      drawFlipper(flipperLeft);
      drawFlipper(flipperRight);

      // Desenhar Mola Real no Canal Direito
      drawSpring();

      // Desenhar Bola
      if (ball.active) {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#e6e6e6';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#aaaaaa';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Game Over
      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#ff0055';
        ctx.font = '22px Arial Black';
        ctx.textAlign = 'center';
        ctx.fillText('FIM DE JOGO', canvas.width / 2, 230);

        ctx.fillStyle = '#ffffff';
        ctx.font = '13px Arial';
        ctx.fillText('Toque em REINICIAR para tentar de novo', canvas.width / 2, 270);
      }
    }

    function drawFlipper(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.angle);
      
      ctx.beginPath();
      ctx.roundRect(0, -6, f.length, 12, 6);
      ctx.fillStyle = '#ffaa00';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.restore();
    }

    // Desenho da Mola Sanfonada Animada
    function drawSpring() {
      let bottomY = launcher.baseY; // Onde a base da mola fica (500)
      let topY = 480 - launcher.pull; // Topo da mola onde a bola se apoia
      let coils = 7;
      let step = (bottomY - topY) / coils;

      ctx.beginPath();
      ctx.moveTo(launcher.x, bottomY);

      for (let i = 0; i < coils; i++) {
        let currentY = bottomY - (i * step);
        let xOffset = (i % 2 === 0) ? 10 : -10;
        ctx.lineTo(launcher.x + xOffset, currentY - step / 2);
        ctx.lineTo(launcher.x, currentY - step);
      }

      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 3;
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#00ffff';
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Base de apoio da mola (pistão)
      ctx.fillStyle = '#ff0055';
      ctx.fillRect(launcher.x - 12, bottomY, 24, 6);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
